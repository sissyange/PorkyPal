<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Profile | PorkyPal</title>

    <style>

        /* ==========================================
           RESET
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #eee4e1;

            color: #493a36;

            display: flex;

            justify-content: center;

            overflow-x: hidden;
            overflow-y: auto;
        }

        button,
        input {
            font-family: inherit;
        }


        /* ==========================================
           PHONE
        ========================================== */

        .phone {

            width: 100%;

            max-width: 430px;

            min-height: 100vh;

            background: #fffaf8;

            position: relative;

            overflow: visible;
        }


        /* ==========================================
           PAGE
        ========================================== */

        .page {

            width: 100%;

            min-height: 100vh;

            padding-bottom: 105px;

            background: #fffaf8;

            overflow: visible;
        }


        /* ==========================================
           HEADER
        ========================================== */

        .top-header {

            padding:
                20px
                18px
                10px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .header-left {

            display: flex;

            align-items: center;

            gap: 11px;
        }

        .back-button {

            width: 39px;
            height: 39px;

            border-radius: 13px;

            border:
                1px solid
                #efd9df;

            background: #ffffff;

            color: #e94b82;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            font-size: 21px;

            box-shadow:
                0 3px 10px
                rgba(80, 45, 40, .04);
        }

        .back-button:active {
            transform: scale(.95);
        }

        .page-title {

            font-size: 21px;

            font-weight: 900;

            color: #493a36;
        }

        .page-title span {
            color: #e94b82;
        }


        /* ==========================================
           CONTENT
        ========================================== */

        .content {

            padding:
                5px
                18px
                0;
        }


        /* ==========================================
           PROFILE CARD
        ========================================== */

        .profile-card {

            width: 100%;

            border-radius: 23px;

            background:
                linear-gradient(
                    135deg,
                    #fff0f4,
                    #ffffff
                );

            border:
                1px solid
                #f1dce2;

            padding: 19px;

            position: relative;

            overflow: hidden;

            box-shadow:
                0 8px 22px
                rgba(
                    90,
                    52,
                    46,
                    .06
                );
        }

        .profile-decoration {

            position: absolute;

            width: 95px;
            height: 95px;

            border-radius: 50%;

            background:
                rgba(
                    244,
                    153,
                    181,
                    .13
                );

            right: -28px;
            top: -28px;
        }

        .profile-main {

            position: relative;

            z-index: 2;

            display: flex;

            align-items: center;

            gap: 14px;
        }

        .profile-avatar {

            width: 75px;
            height: 75px;

            flex-shrink: 0;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #ffdce8,
                    #fff0f4
                );

            border:
                1px solid
                #f2c6d5;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 40px;

            box-shadow:
                0 5px 12px
                rgba(
                    227,
                    75,
                    126,
                    .10
                );
        }

        .profile-info {

            min-width: 0;

            flex: 1;
        }

        .profile-name {

            font-size: 18px;

            font-weight: 900;

            color: #493a36;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .profile-email {

            margin-top: 5px;

            color: #9d8b85;

            font-size: 10px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .profile-role {

            display: inline-flex;

            align-items: center;

            margin-top: 9px;

            padding:
                5px
                9px;

            border-radius: 8px;

            background: #ffe3ec;

            color: #e94b82;

            font-size: 8px;

            font-weight: 800;
        }


        /* ==========================================
           EDIT PROFILE
        ========================================== */

        .edit-profile-button {

            width: 100%;

            height: 39px;

            margin-top: 15px;

            border:
                1px solid
                #f1c8d5;

            border-radius: 12px;

            background: #ffffff;

            color: #e94b82;

            font-size: 10px;

            font-weight: 800;

            cursor: pointer;

            position: relative;

            z-index: 2;
        }

        .edit-profile-button:active {
            transform: scale(.98);
        }


        /* ==========================================
           SECTION
        ========================================== */

        .section {

            margin-top: 20px;
        }

        .section-title {

            font-size: 14px;

            font-weight: 900;

            color: #493a36;

            margin-bottom: 9px;
        }


        /* ==========================================
           MENU CARD
        ========================================== */

        .menu-card {

            width: 100%;

            border:
                1px solid
                #f0dfe3;

            border-radius: 18px;

            background: #ffffff;

            overflow: hidden;

            box-shadow:
                0 4px 13px
                rgba(
                    80,
                    48,
                    43,
                    .04
                );
        }

        .menu-button {

            width: 100%;

            min-height: 63px;

            padding:
                11px
                13px;

            border: none;

            border-bottom:
                1px solid
                #f5e8eb;

            background: #ffffff;

            display: flex;

            align-items: center;

            text-align: left;

            cursor: pointer;
        }

        .menu-button:last-child {
            border-bottom: none;
        }

        .menu-button:active {
            background: #fff6f8;
        }

        .menu-icon {

            width: 39px;
            height: 39px;

            flex-shrink: 0;

            border-radius: 12px;

            background: #fff0f4;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 18px;

            margin-right: 11px;
        }

        .menu-info {

            min-width: 0;

            flex: 1;
        }

        .menu-title {

            font-size: 11px;

            font-weight: 800;

            color: #493a36;
        }

        .menu-subtitle {

            margin-top: 3px;

            color: #aa9791;

            font-size: 8px;
        }

        .menu-arrow {

            color: #c5aaa9;

            font-size: 20px;

            margin-left: 8px;
        }


        /* ==========================================
           ACCOUNT INFO
        ========================================== */

        .account-card {

            width: 100%;

            border:
                1px solid
                #f0dfe3;

            border-radius: 18px;

            background: #ffffff;

            padding: 14px;

            box-shadow:
                0 4px 13px
                rgba(
                    80,
                    48,
                    43,
                    .04
                );
        }

        .account-row {

            display: flex;

            justify-content: space-between;

            gap: 15px;

            padding: 10px 0;

            border-bottom:
                1px solid
                #f5e8eb;
        }

        .account-row:last-child {
            border-bottom: none;
        }

        .account-label {

            color: #aa9791;

            font-size: 9px;
        }

        .account-value {

            color: #493a36;

            font-size: 10px;

            font-weight: 800;

            text-align: right;

            max-width: 60%;

            word-break: break-word;
        }


        /* ==========================================
           LOGOUT
        ========================================== */

        .logout-button {

            width: 100%;

            height: 47px;

            margin-top: 20px;

            border:
                1px solid
                #efcbd3;

            border-radius: 14px;

            background: #fff6f7;

            color: #d85d72;

            font-size: 11px;

            font-weight: 900;

            cursor: pointer;
        }

        .logout-button:active {
            transform: scale(.98);
        }


        /* ==========================================
           APP VERSION
        ========================================== */

        .app-version {

            text-align: center;

            margin-top: 17px;

            color: #b5a49f;

            font-size: 8px;

            padding-bottom: 10px;
        }


        /* ==========================================
           MODAL
        ========================================== */

        .modal-overlay {

            position: fixed;

            inset: 0;

            z-index: 100;

            background:
                rgba(
                    50,
                    30,
                    27,
                    .40
                );

            display: none;

            align-items: flex-end;

            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {

            width: 100%;

            max-width: 430px;

            max-height: 90vh;

            overflow-y: auto;

            background: #fffaf8;

            border-radius:
                25px
                25px
                0
                0;

            padding:
                20px
                18px
                28px;

            animation:
                slideUp .2s ease;
        }

        @keyframes slideUp {

            from {
                transform:
                    translateY(100%);
            }

            to {
                transform:
                    translateY(0);
            }
        }

        .modal-handle {

            width: 38px;

            height: 4px;

            border-radius: 10px;

            background: #dfccc8;

            margin:
                0 auto
                18px;
        }

        .modal-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 17px;
        }

        .modal-title {

            font-size: 18px;

            font-weight: 900;

            color: #493a36;
        }

        .close-modal {

            width: 34px;
            height: 34px;

            border-radius: 11px;

            border:
                1px solid
                #efdce2;

            background: #ffffff;

            color: #8e7a74;

            font-size: 18px;

            cursor: pointer;
        }


        /* ==========================================
           FORM
        ========================================== */

        .form-group {
            margin-bottom: 13px;
        }

        .form-label {

            display: block;

            margin-bottom: 6px;

            color: #594741;

            font-size: 10px;

            font-weight: 800;
        }

        .form-input {

            width: 100%;

            height: 45px;

            border:
                1.5px solid
                #efdce2;

            border-radius: 13px;

            background: #ffffff;

            color: #493a36;

            outline: none;

            padding:
                0 12px;

            font-size: 11px;
        }

        .form-input:focus {

            border-color:
                #ed7da2;

            box-shadow:
                0 0 0 3px
                rgba(
                    239,
                    79,
                    135,
                    .08
                );
        }

        .save-button {

            width: 100%;

            height: 47px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #f65b91,
                    #e9417b
                );

            color: #ffffff;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;

            margin-top: 5px;
        }


        /* ==========================================
           LOGOUT MODAL
        ========================================== */

        .confirm-icon {

            width: 60px;
            height: 60px;

            border-radius: 19px;

            background: #fff0f3;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

            margin:
                0 auto
                14px;
        }

        .confirm-title {

            text-align: center;

            font-size: 17px;

            font-weight: 900;

            color: #493a36;
        }

        .confirm-text {

            text-align: center;

            margin-top: 6px;

            color: #a08e88;

            font-size: 10px;

            line-height: 1.5;
        }

        .confirm-actions {

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 10px;

            margin-top: 20px;
        }

        .confirm-button {

            height: 44px;

            border-radius: 13px;

            font-size: 11px;

            font-weight: 800;

            cursor: pointer;
        }

        .cancel-button {

            border:
                1px solid
                #ecdce0;

            background: #ffffff;

            color: #8f7b75;
        }

        .logout-confirm-button {

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #e96b7e,
                    #d85269
                );

            color: #ffffff;
        }


        /* ==========================================
           BOTTOM NAV
        ========================================== */

        .bottom-nav {

            position: fixed;

            left: 50%;

            bottom: 0;

            transform:
                translateX(-50%);

            width: 100%;

            max-width: 430px;

            height: 72px;

            background:
                rgba(
                    255,
                    250,
                    248,
                    .97
                );

            border-top:
                1px solid
                #f0dfe3;

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            z-index: 50;

            padding-bottom: 4px;
        }

        .nav-button {

            border: none;

            background: transparent;

            cursor: pointer;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 4px;

            color: #a99a95;

            font-size: 9px;

            font-weight: 600;
        }

        .nav-icon {

            width: 29px;
            height: 29px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            font-size: 17px;
        }

        .nav-button.active {
            color: #e94b82;
        }

        .nav-button.active .nav-icon {
            background: #ffe6ee;
        }


        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (min-width: 600px) {

            body {

                align-items: flex-start;

                padding: 20px 0;
            }

            .phone {

                min-height:
                    calc(100vh - 40px);

                border-radius: 35px;

                box-shadow:
                    0 20px 60px
                    rgba(
                        70,
                        45,
                        38,
                        .18
                    );
            }

            .page {

                min-height:
                    calc(100vh - 40px);

                border-radius: 35px;
            }
        }

    </style>

</head>


<body>


<div class="phone">


    <main class="page">


        <!-- ==========================================
             HEADER
        ========================================== -->

        <header class="top-header">

            <div class="header-left">

                <button
                    type="button"
                    class="back-button"
                    id="backButton">

                    ←

                </button>


                <div class="page-title">

                    My
                    <span>Profile</span>

                </div>

            </div>

        </header>


        <!-- ==========================================
             CONTENT
        ========================================== -->

        <section class="content">


            <!-- ======================================
                 PROFILE CARD
            ====================================== -->

            <div class="profile-card">


                <div class="profile-decoration"></div>


                <div class="profile-main">


                    <div class="profile-avatar">

                        🐷

                    </div>


                    <div class="profile-info">

                        <div
                            class="profile-name"
                            id="profileName">

                            User

                        </div>


                        <div
                            class="profile-email"
                            id="profileEmail">

                            user@email.com

                        </div>


                        <div class="profile-role">

                            🐷 Pig Owner

                        </div>

                    </div>


                </div>


                <button
                    type="button"
                    class="edit-profile-button"
                    id="editProfileButton">

                    ✏️ Edit Profile

                </button>


            </div>


            <!-- ======================================
                 ACCOUNT
            ====================================== -->

            <div class="section">


                <div class="section-title">

                    Account

                </div>


                <div class="account-card">


                    <div class="account-row">

                        <div class="account-label">
                            Full Name
                        </div>

                        <div
                            class="account-value"
                            id="accountName">

                            -

                        </div>

                    </div>


                    <div class="account-row">

                        <div class="account-label">
                            Email
                        </div>

                        <div
                            class="account-value"
                            id="accountEmail">

                            -

                        </div>

                    </div>


                    <div class="account-row">

                        <div class="account-label">
                            Account Type
                        </div>

                        <div class="account-value">

                            Pig Owner

                        </div>

                    </div>


                </div>


            </div>


            <!-- ======================================
                 SETTINGS
            ====================================== -->

            <div class="section">


                <div class="section-title">

                    Settings

                </div>


                <div class="menu-card">


                    <button
                        type="button"
                        class="menu-button"
                        id="notificationsButton">


                        <div class="menu-icon">
                            🔔
                        </div>


                        <div class="menu-info">

                            <div class="menu-title">
                                Notifications
                            </div>

                            <div class="menu-subtitle">
                                Manage your notifications
                            </div>

                        </div>


                        <div class="menu-arrow">
                            ›
                        </div>


                    </button>


                    <button
                        type="button"
                        class="menu-button"
                        id="preferencesButton">


                        <div class="menu-icon">
                            ⚙️
                        </div>


                        <div class="menu-info">

                            <div class="menu-title">
                                Preferences
                            </div>

                            <div class="menu-subtitle">
                                Customize your PorkyPal experience
                            </div>

                        </div>


                        <div class="menu-arrow">
                            ›
                        </div>


                    </button>


                </div>


            </div>


            <!-- ======================================
                 HELP
            ====================================== -->

            <div class="section">


                <div class="section-title">

                    Support

                </div>


                <div class="menu-card">


                    <button
                        type="button"
                        class="menu-button"
                        id="helpButton">


                        <div class="menu-icon">
                            ❓
                        </div>


                        <div class="menu-info">

                            <div class="menu-title">
                                Help & Support
                            </div>

                            <div class="menu-subtitle">
                                Get help using PorkyPal
                            </div>

                        </div>


                        <div class="menu-arrow">
                            ›
                        </div>


                    </button>


                    <button
                        type="button"
                        class="menu-button"
                        id="aboutButton">


                        <div class="menu-icon">
                            ℹ️
                        </div>


                        <div class="menu-info">

                            <div class="menu-title">
                                About PorkyPal
                            </div>

                            <div class="menu-subtitle">
                                Learn more about the application
                            </div>

                        </div>


                        <div class="menu-arrow">
                            ›
                        </div>


                    </button>


                </div>


            </div>


            <!-- ======================================
                 LOGOUT
            ====================================== -->

            <button
                type="button"
                class="logout-button"
                id="logoutButton">

                🚪 Log Out

            </button>


            <div class="app-version">

                PorkyPal • Healthy Pigs, Brighter Tomorrows

            </div>


        </section>


    </main>


    <!-- ==========================================
         EDIT PROFILE MODAL
    ========================================== -->

    <div
        class="modal-overlay"
        id="editModal">


        <div class="modal">


            <div class="modal-handle"></div>


            <div class="modal-header">

                <div class="modal-title">

                    Edit Profile

                </div>


                <button
                    type="button"
                    class="close-modal"
                    id="closeEditModal">

                    ×

                </button>

            </div>


            <form id="profileForm">


                <div class="form-group">

                    <label
                        class="form-label"
                        for="editName">

                        Full Name

                    </label>


                    <input
                        type="text"
                        id="editName"
                        class="form-input"
                        placeholder="Enter your full name"
                        maxlength="80"
                        required
                    >

                </div>


                <div class="form-group">

                    <label
                        class="form-label"
                        for="editEmail">

                        Email Address

                    </label>


                    <input
                        type="email"
                        id="editEmail"
                        class="form-input"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="save-button">

                    Save Changes

                </button>


            </form>


        </div>

    </div>


    <!-- ==========================================
         LOGOUT MODAL
    ========================================== -->

    <div
        class="modal-overlay"
        id="logoutModal">


        <div class="modal">


            <div class="modal-handle"></div>


            <div class="confirm-icon">
                🚪
            </div>


            <div class="confirm-title">

                Log out of PorkyPal?

            </div>


            <div class="confirm-text">

                Your pig records and activities will
                remain saved to this account.

            </div>


            <div class="confirm-actions">


                <button
                    type="button"
                    class="confirm-button cancel-button"
                    id="cancelLogout">

                    Cancel

                </button>


                <button
                    type="button"
                    class="confirm-button logout-confirm-button"
                    id="confirmLogout">

                    Log Out

                </button>


            </div>


        </div>

    </div>


    <!-- ==========================================
         BOTTOM NAV
    ========================================== -->

    <nav class="bottom-nav">


        <button
            type="button"
            class="nav-button"
            data-page="home.html">

            <div class="nav-icon">
                🏠
            </div>

            <span>
                Home
            </span>

        </button>


        <button
            type="button"
            class="nav-button"
            data-page="pigs.html">

            <div class="nav-icon">
                🐷
            </div>

            <span>
                Pigs
            </span>

        </button>


        <button
            type="button"
            class="nav-button"
            data-page="feed.html">

            <div class="nav-icon">
                🍚
            </div>

            <span>
                Feed
            </span>

        </button>


        <button
            type="button"
            class="nav-button"
            data-page="health.html">

            <div class="nav-icon">
                ❤️
            </div>

            <span>
                Health
            </span>

        </button>


        <button
            type="button"
            class="nav-button active"
            data-page="profile.html">

            <div class="nav-icon">
                👤
            </div>

            <span>
                Profile
            </span>

        </button>


    </nav>


</div>


<script>

(function () {


    /* ==========================================
       LOGIN CHECK
    ========================================== */

    const loggedIn =
        localStorage.getItem(
            "porkyPalLoggedIn"
        );

    const currentUserRaw =
        localStorage.getItem(
            "porkyPalCurrentUser"
        );


    if (
        loggedIn !== "true" ||
        !currentUserRaw
    ) {

        window.location.replace(
            "login.html"
        );

        return;
    }


    let currentUser;


    try {

        currentUser =
            JSON.parse(
                currentUserRaw
            );

    } catch (error) {

        localStorage.removeItem(
            "porkyPalLoggedIn"
        );

        localStorage.removeItem(
            "porkyPalCurrentUser"
        );

        window.location.replace(
            "login.html"
        );

        return;
    }


    /* ==========================================
       ELEMENTS
    ========================================== */

    const profileName =
        document.getElementById(
            "profileName"
        );

    const profileEmail =
        document.getElementById(
            "profileEmail"
        );

    const accountName =
        document.getElementById(
            "accountName"
        );

    const accountEmail =
        document.getElementById(
            "accountEmail"
        );


    const editModal =
        document.getElementById(
            "editModal"
        );

    const logoutModal =
        document.getElementById(
            "logoutModal"
        );


    /* ==========================================
       DISPLAY USER
    ========================================== */

    function displayUser() {


        const name =
            currentUser.fullName ||
            "PorkyPal User";


        const email =
            currentUser.email ||
            "No email";


        profileName.textContent =
            name;


        profileEmail.textContent =
            email;


        accountName.textContent =
            name;


        accountEmail.textContent =
            email;

    }


    displayUser();


    /* ==========================================
       EDIT PROFILE
    ========================================== */

    document
        .getElementById(
            "editProfileButton"
        )
        .addEventListener(
            "click",
            function () {


                document
                    .getElementById(
                        "editName"
                    )
                    .value =
                    currentUser.fullName ||
                    "";


                document
                    .getElementById(
                        "editEmail"
                    )
                    .value =
                    currentUser.email ||
                    "";


                editModal.classList.add(
                    "show"
                );

            }
        );


    /* ==========================================
       CLOSE EDIT
    ========================================== */

    function closeEditModal() {

        editModal.classList.remove(
            "show"
        );

    }


    document
        .getElementById(
            "closeEditModal"
        )
        .addEventListener(
            "click",
            closeEditModal
        );


    editModal.addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                editModal
            ) {

                closeEditModal();

            }

        }
    );


    /* ==========================================
       SAVE PROFILE
    ========================================== */

    document
        .getElementById(
            "profileForm"
        )
        .addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const newName =
                    document
                        .getElementById(
                            "editName"
                        )
                        .value
                        .trim();


                const newEmail =
                    document
                        .getElementById(
                            "editEmail"
                        )
                        .value
                        .trim()
                        .toLowerCase();


                if (!newName) {

                    alert(
                        "Please enter your full name."
                    );

                    return;
                }


                if (!newEmail) {

                    alert(
                        "Please enter your email."
                    );

                    return;
                }


                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                if (
                    !emailPattern.test(
                        newEmail
                    )
                ) {

                    alert(
                        "Please enter a valid email address."
                    );

                    return;
                }


                const oldEmail =
                    String(
                        currentUser.email ||
                        ""
                    )
                    .trim()
                    .toLowerCase();


                /* ==================================
                   KEEP OLD USER DATA KEY
                   IF EMAIL IS CHANGED
                ================================== */

                if (
                    oldEmail &&
                    oldEmail !== newEmail
                ) {


                    const oldKey =
                        "porkyPal_homeData_" +
                        encodeURIComponent(
                            oldEmail
                        );


                    const newKey =
                        "porkyPal_homeData_" +
                        encodeURIComponent(
                            newEmail
                        );


                    const oldData =
                        localStorage.getItem(
                            oldKey
                        );


                    if (
                        oldData &&
                        !localStorage.getItem(
                            newKey
                        )
                    ) {

                        localStorage.setItem(
                            newKey,
                            oldData
                        );

                    }

                }


                /* ==================================
                   UPDATE CURRENT USER
                ================================== */

                currentUser.fullName =
                    newName;


                currentUser.email =
                    newEmail;


                localStorage.setItem(
                    "porkyPalCurrentUser",
                    JSON.stringify(
                        currentUser
                    )
                );


                /* ==================================
                   UPDATE ACCOUNT
                ================================== */

                const savedAccount =
                    localStorage.getItem(
                        "porkyPalAccount"
                    );


                if (savedAccount) {

                    try {

                        const account =
                            JSON.parse(
                                savedAccount
                            );


                        if (
                            String(
                                account.email ||
                                ""
                            )
                            .trim()
                            .toLowerCase()
                            === oldEmail
                        ) {

                            account.fullName =
                                newName;

                            account.email =
                                newEmail;


                            localStorage.setItem(
                                "porkyPalAccount",
                                JSON.stringify(
                                    account
                                )
                            );

                        }

                    } catch (error) {

                        console.log(
                            "Account update skipped."
                        );

                    }

                }


                displayUser();


                closeEditModal();


                alert(
                    "Profile updated successfully."
                );

            }
        );


    /* ==========================================
       NOTIFICATIONS
    ========================================== */

    document
        .getElementById(
            "notificationsButton"
        )
        .addEventListener(
            "click",
            function () {

                alert(
                    "Notifications settings will be connected here."
                );

            }
        );


    /* ==========================================
       PREFERENCES
    ========================================== */

    document
        .getElementById(
            "preferencesButton"
        )
        .addEventListener(
            "click",
            function () {

                alert(
                    "Preferences will be connected here."
                );

            }
        );


    /* ==========================================
       HELP
    ========================================== */

    document
        .getElementById(
            "helpButton"
        )
        .addEventListener(
            "click",
            function () {

                alert(
                    "PorkyPal Help & Support\n\n" +
                    "Use the bottom navigation to manage your pigs, feeding records, health records, and profile."
                );

            }
        );


    /* ==========================================
       ABOUT
    ========================================== */

    document
        .getElementById(
            "aboutButton"
        )
        .addEventListener(
            "click",
            function () {

                alert(
                    "PorkyPal\n\n" +
                    "Healthy Pigs, Brighter Tomorrows.\n\n" +
                    "A pig management application designed to help users monitor and manage their pigs."
                );

            }
        );


    /* ==========================================
       LOGOUT MODAL
    ========================================== */

    document
        .getElementById(
            "logoutButton"
        )
        .addEventListener(
            "click",
            function () {

                logoutModal.classList.add(
                    "show"
                );

            }
        );


    document
        .getElementById(
            "cancelLogout"
        )
        .addEventListener(
            "click",
            function () {

                logoutModal.classList.remove(
                    "show"
                );

            }
        );


    logoutModal.addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                logoutModal
            ) {

                logoutModal.classList.remove(
                    "show"
                );

            }

        }
    );


    /* ==========================================
       CONFIRM LOGOUT
    ========================================== */

    document
        .getElementById(
            "confirmLogout"
        )
        .addEventListener(
            "click",
            function () {


                /*
                   IMPORTANT:
                   Do NOT delete the user's
                   pig records or activities.
                */

                localStorage.removeItem(
                    "porkyPalLoggedIn"
                );

                localStorage.removeItem(
                    "porkyPalCurrentUser"
                );


                window.location.replace(
                    "login.html"
                );

            }
        );


    /* ==========================================
       BACK
    ========================================== */

    document
        .getElementById(
            "backButton"
        )
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "home.html";

            }
        );


    /* ==========================================
       BOTTOM NAV
    ========================================== */

    document
        .querySelectorAll(
            ".nav-button"
        )
        .forEach(
            function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        const page =
                            button.dataset.page;


                        if (page) {

                            window.location.href =
                                page;

                        }

                    }
                );

            }
        );


})();

</script>


</body>

</html>
