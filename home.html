<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Home | PorkyPal</title>

    <style>

        /* ==========================================
           RESET
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #eee4e1;

            display: flex;
            justify-content: center;

            color: #493a36;

            /* IMPORTANT SCROLL FIX */
            overflow-x: hidden;
            overflow-y: auto;
        }

        button {
            font-family: inherit;
        }


        /* ==========================================
           PHONE
        ========================================== */

        .phone {
            width: 100%;
            max-width: 430px;

            min-height: 100vh;
            height: auto;

            background: #fffaf8;

            position: relative;

            /* FIX: DO NOT HIDE PAGE CONTENT */
            overflow: visible;
        }


        /* ==========================================
           HOME
        ========================================== */

        .home {
            width: 100%;

            min-height: 100vh;

            height: auto;

            padding-bottom: 110px;

            background: #fffaf8;

            /* FIX */
            overflow: visible;
        }


        /* ==========================================
           HEADER
        ========================================== */

        .header {
            padding:
                20px
                18px
                12px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;

            border-radius: 13px;

            background: #ffe0ea;

            border: 1px solid #f5b7ca;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 21px;
        }

        .brand {
            font-family:
                "Trebuchet MS",
                Arial,
                sans-serif;

            font-size: 23px;

            font-weight: 900;

            letter-spacing: -1px;

            color: #ed4c84;
        }

        .brand span {
            color: #f28aa9;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notification-button,
        .profile-button {
            width: 39px;
            height: 39px;

            border-radius: 13px;

            border: 1px solid #efd9df;

            background: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            color: #e94b82;

            box-shadow:
                0 3px 10px
                rgba(80, 45, 40, 0.05);
        }

        .notification-button {
            font-size: 17px;
        }

        .profile-button {
            font-size: 19px;
        }

        .profile-button:active,
        .notification-button:active,
        .add-pig-button:active,
        .quick-button:active {
            transform: scale(.96);
        }


        /* ==========================================
           WELCOME
        ========================================== */

        .welcome {
            padding:
                8px
                18px
                14px;
        }

        .welcome-small {
            color: #a08d87;

            font-size: 11px;

            margin-bottom: 4px;
        }

        .welcome-name {
            color: #493a36;

            font-size: 24px;

            font-weight: 800;

            line-height: 1.2;
        }

        .welcome-name span {
            color: #ed4c84;
        }


        /* ==========================================
           CONTENT
        ========================================== */

        .content {
            padding: 0 18px;

            /* FIX */
            width: 100%;
            height: auto;
            overflow: visible;
        }


        /* ==========================================
           STATS
        ========================================== */

        .stats {
            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 10px;

            margin-top: 6px;
        }

        .stat-card {
            min-height: 90px;

            padding: 13px;

            border-radius: 17px;

            background: #ffffff;

            border: 1px solid #f0dfe3;

            box-shadow:
                0 5px 16px
                rgba(78, 47, 40, 0.05);

            display: flex;
            align-items: center;

            gap: 10px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;

            flex-shrink: 0;

            border-radius: 13px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #fff0f4;

            font-size: 19px;
        }

        .stat-info {
            min-width: 0;
        }

        .stat-number {
            color: #493a36;

            font-size: 22px;

            font-weight: 900;

            line-height: 1;
        }

        .stat-label {
            margin-top: 5px;

            color: #9b8882;

            font-size: 10px;
        }


        /* ==========================================
           ADD PIG
        ========================================== */

        .add-pig-button {
            width: 100%;

            height: 48px;

            margin-top: 12px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #f65b91,
                    #e9417b
                );

            color: #ffffff;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 7px 16px
                rgba(239, 79, 135, .20);
        }


        /* ==========================================
           SECTION
        ========================================== */

        .section-header {
            margin-top: 22px;

            margin-bottom: 10px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .section-title {
            color: #493a36;

            font-size: 15px;

            font-weight: 800;
        }

        .section-link {
            border: none;

            background: transparent;

            color: #e94b82;

            font-size: 10px;

            font-weight: 700;

            cursor: pointer;
        }


        /* ==========================================
           EMPTY STATE
        ========================================== */

        .empty-card {
            width: 100%;

            min-height: 135px;

            border:
                1px dashed
                #edcbd5;

            border-radius: 18px;

            background: #fffdfc;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 20px;
        }

        .empty-icon {
            width: 45px;
            height: 45px;

            border-radius: 50%;

            background: #fff0f4;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

            margin-bottom: 9px;
        }

        .empty-title {
            font-size: 12px;

            font-weight: 800;

            color: #594741;
        }

        .empty-text {
            margin-top: 5px;

            font-size: 10px;

            line-height: 1.5;

            color: #a3918b;
        }


        /* ==========================================
           QUICK ACTIONS
        ========================================== */

        .quick-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;
        }

        .quick-button {
            min-height: 78px;

            border: 1px solid #f0dfe3;

            border-radius: 16px;

            background: #ffffff;

            box-shadow:
                0 4px 13px
                rgba(78, 47, 40, 0.04);

            cursor: pointer;

            text-align: left;

            padding: 13px;

            transition:
                transform .15s;
        }

        .quick-icon {
            width: 31px;
            height: 31px;

            border-radius: 10px;

            background: #fff0f4;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 15px;

            margin-bottom: 7px;
        }

        .quick-title {
            color: #594741;

            font-size: 11px;

            font-weight: 800;
        }

        .quick-subtitle {
            margin-top: 2px;

            color: #a3918b;

            font-size: 8px;
        }


        /* ==========================================
           RECENT ACTIVITY
        ========================================== */

        .activity-card {
            border: 1px solid #f0dfe3;

            border-radius: 17px;

            background: #ffffff;

            overflow: hidden;

            box-shadow:
                0 4px 13px
                rgba(78, 47, 40, 0.04);

            /* IMPORTANT */
            width: 100%;
        }

        .activity-list {
            width: 100%;

            display: flex;

            flex-direction: column;
        }

        .activity-item {
            width: 100%;

            min-height: 68px;

            padding:
                11px
                13px;

            border: none;

            border-bottom:
                1px solid
                #f3e7e9;

            background: #ffffff;

            display: flex;

            align-items: center;

            gap: 10px;

            text-align: left;

            cursor: pointer;

            transition:
                background .15s;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-item:active {
            background: #fff3f7;
        }

        .activity-icon {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            border-radius: 12px;

            background: #fff0f4;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 17px;
        }

        .activity-info {
            flex: 1;

            min-width: 0;
        }

        .activity-text {
            color: #594741;

            font-size: 10px;

            font-weight: 800;

            line-height: 1.4;
        }

        .activity-time {
            margin-top: 4px;

            color: #a3918b;

            font-size: 8px;
        }

        .activity-arrow {
            color: #d0b8bf;

            font-size: 17px;
        }

        .activity-empty {
            padding: 20px;

            text-align: center;

            color: #a3918b;

            font-size: 10px;
        }


        /* ==========================================
           BOTTOM NAV
        ========================================== */

        .bottom-nav {
            position: fixed;

            left: 50%;

            bottom: 0;

            transform:
                translateX(-50%);

            width: 100%;

            max-width: 430px;

            height: 72px;

            background:
                rgba(
                    255,
                    250,
                    248,
                    .97
                );

            border-top:
                1px solid
                #f0dfe3;

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            z-index: 50;

            padding-bottom: 4px;
        }

        .nav-button {
            border: none;

            background: transparent;

            cursor: pointer;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 4px;

            color: #a99a95;

            font-size: 9px;

            font-weight: 600;
        }

        .nav-icon {
            width: 29px;
            height: 29px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            font-size: 17px;
        }

        .nav-button.active {
            color: #e94b82;
        }

        .nav-button.active .nav-icon {
            background: #ffe6ee;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 599px) {

            body {
                align-items: flex-start;
                overflow-x: hidden;
                overflow-y: auto;
            }

            .phone {
                width: 100%;
                max-width: 430px;

                min-height: 100vh;
                height: auto;

                overflow: visible;
            }

            .home {
                min-height: 100vh;
                height: auto;

                padding-bottom: 105px;

                overflow: visible;
            }
        }


        /* ==========================================
           DESKTOP
        ========================================== */

        @media (min-width: 600px) {

            body {
                align-items: flex-start;

                overflow-x: hidden;
                overflow-y: auto;

                padding: 20px 0;
            }

            .phone {
                min-height: calc(100vh - 40px);

                /* IMPORTANT:
                   REMOVE fixed 100vh */
                height: auto;

                max-height: none;

                border-radius: 35px;

                box-shadow:
                    0 20px 60px
                    rgba(
                        70,
                        45,
                        38,
                        .18
                    );

                overflow: visible;
            }

            .home {
                min-height: calc(100vh - 40px);

                height: auto;

                padding-bottom: 110px;

                border-radius: 35px;

                overflow: visible;
            }

            .bottom-nav {
                bottom: 0;
            }
        }


        /* ==========================================
           FINAL SCROLL SAFETY
        ========================================== */

        html {
            width: 100%;
            min-height: 100%;

            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            width: 100%;
            min-height: 100vh;

            overflow-x: hidden !important;
            overflow-y: auto !important;
        }

        .phone,
        .home,
        .content {
            overflow: visible !important;
        }

    </style>

</head>


<body>

<div class="phone">

    <main class="home">

        <!-- ==========================================
             HEADER
        ========================================== -->

        <header class="header">

            <div class="brand-area">

                <div class="brand-icon">
                    🐷
                </div>

                <div class="brand">
                    Porky<span>Pal</span>
                </div>

            </div>


            <div class="header-actions">

                <button
                    type="button"
                    class="notification-button"
                    id="notificationButton"
                    aria-label="Notifications">

                    🔔

                </button>


                <button
                    type="button"
                    class="profile-button"
                    id="profileButton"
                    aria-label="Profile">

                    👤

                </button>

            </div>

        </header>


        <!-- ==========================================
             WELCOME
        ========================================== -->

        <section class="welcome">

            <div class="welcome-small">
                Welcome back,
            </div>

            <div class="welcome-name">
                Hello,
                <span id="userName">
                    User
                </span>!
            </div>

        </section>


        <!-- ==========================================
             CONTENT
        ========================================== -->

        <section class="content">


            <!-- ==========================================
                 STATS
            ========================================== -->

            <div class="stats">

                <div class="stat-card">

                    <div class="stat-icon">
                        🐷
                    </div>

                    <div class="stat-info">

                        <div
                            class="stat-number"
                            id="totalPigs">

                            0

                        </div>

                        <div class="stat-label">
                            Total Pigs
                        </div>

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">
                        🍚
                    </div>

                    <div class="stat-info">

                        <div
                            class="stat-number"
                            id="todayFeedings">

                            0

                        </div>

                        <div class="stat-label">
                            Today's Feedings
                        </div>

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">
                        ❤️
                    </div>

                    <div class="stat-info">

                        <div
                            class="stat-number"
                            id="healthRecords">

                            0

                        </div>

                        <div class="stat-label">
                            Health Records
                        </div>

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">
                        📅
                    </div>

                    <div class="stat-info">

                        <div
                            class="stat-number"
                            id="upcomingEvents">

                            0

                        </div>

                        <div class="stat-label">
                            Upcoming Events
                        </div>

                    </div>

                </div>

            </div>


            <!-- ==========================================
                 ADD PIG
            ========================================== -->

            <button
                type="button"
                class="add-pig-button"
                id="addPigButton">

                ＋ Add Pig

            </button>


            <!-- ==========================================
                 MY PIGS
            ========================================== -->

            <div class="section-header">

                <div class="section-title">
                    My Pigs
                </div>

                <button
                    type="button"
                    class="section-link"
                    id="viewPigsButton">

                    View All

                </button>

            </div>


            <div
                class="empty-card"
                id="pigsEmptyState">

                <div class="empty-icon">
                    🐷
                </div>

                <div class="empty-title">
                    No pigs added yet
                </div>

                <div class="empty-text">
                    Add your first pig to start
                    monitoring your pig records.
                </div>

            </div>


            <!-- ==========================================
                 QUICK ACTIONS
            ========================================== -->

            <div class="section-header">

                <div class="section-title">
                    Quick Actions
                </div>

            </div>


            <div class="quick-grid">


                <button
                    type="button"
                    class="quick-button"
                    id="feedingButton">

                    <div class="quick-icon">
                        🍚
                    </div>

                    <div class="quick-title">
                        Feeding
                    </div>

                    <div class="quick-subtitle">
                        Manage feeding
                    </div>

                </button>


                <button
                    type="button"
                    class="quick-button"
                    id="healthButton">

                    <div class="quick-icon">
                        ❤️
                    </div>

                    <div class="quick-title">
                        Health
                    </div>

                    <div class="quick-subtitle">
                        Health records
                    </div>

                </button>


                <button
                    type="button"
                    class="quick-button"
                    id="calendarButton">

                    <div class="quick-icon">
                        📅
                    </div>

                    <div class="quick-title">
                        Calendar
                    </div>

                    <div class="quick-subtitle">
                        View events
                    </div>

                </button>


                <button
                    type="button"
                    class="quick-button"
                    id="profileQuickButton">

                    <div class="quick-icon">
                        👤
                    </div>

                    <div class="quick-title">
                        Profile
                    </div>

                    <div class="quick-subtitle">
                        Account settings
                    </div>

                </button>

            </div>


            <!-- ==========================================
                 RECENT ACTIVITY
            ========================================== -->

            <div class="section-header">

                <div class="section-title">
                    Recent Activity
                </div>

            </div>


            <div class="activity-card">

                <div
                    class="activity-list"
                    id="activityList">
                </div>

                <div
                    class="activity-empty"
                    id="activityEmpty">

                    No recent activity yet.

                </div>

            </div>


        </section>

    </main>


    <!-- ==========================================
         BOTTOM NAV
    ========================================== -->

    <nav class="bottom-nav">

        <button
            type="button"
            class="nav-button active"
            data-page="home.html">

            <div class="nav-icon">
                🏠
            </div>

            <span>
                Home
            </span>

        </button>


        <button
            type="button"
            class="nav-button"
            data-page="pigs.html">

            <div class="nav-icon">
                🐷
            </div>

            <span>
                Pigs
            </span>

        </button>


        <button
            type="button"
            class="nav-button"
            data-page="feed.html">

            <div class="nav-icon">
                🍚
            </div>

            <span>
                Feed
            </span>

        </button>


        <button
            type="button"
            class="nav-button"
            data-page="health.html">

            <div class="nav-icon">
                ❤️
            </div>

            <span>
                Health
            </span>

        </button>


        <button
            type="button"
            class="nav-button"
            data-page="profile.html">

            <div class="nav-icon">
                👤
            </div>

            <span>
                Profile
            </span>

        </button>

    </nav>

</div>


<script>

(function () {

    /* ==========================================
       USER SESSION
    ========================================== */

    const currentUserRaw =
        localStorage.getItem(
            "porkyPalCurrentUser"
        );

    const loggedIn =
        localStorage.getItem(
            "porkyPalLoggedIn"
        );


    if (
        loggedIn !== "true" ||
        !currentUserRaw
    ) {

        window.location.replace(
            "login.html"
        );

        return;
    }


    let currentUser;


    try {

        currentUser =
            JSON.parse(
                currentUserRaw
            );

    } catch (error) {

        localStorage.removeItem(
            "porkyPalLoggedIn"
        );

        localStorage.removeItem(
            "porkyPalCurrentUser"
        );

        window.location.replace(
            "login.html"
        );

        return;
    }


    /* ==========================================
       USER EMAIL
    ========================================== */

    const email =
        String(
            currentUser.email || ""
        )
        .trim()
        .toLowerCase();


    if (!email) {

        window.location.replace(
            "login.html"
        );

        return;
    }


    /* ==========================================
       USER-SPECIFIC KEY
    ========================================== */

    function getUserKey(type) {

        return (
            "porkyPal_" +
            type +
            "_" +
            encodeURIComponent(email)
        );

    }


    const dataKey =
        getUserKey("homeData");


    /* ==========================================
       LOAD USER DATA
    ========================================== */

    let userData = null;


    try {

        userData =
            JSON.parse(
                localStorage.getItem(
                    dataKey
                )
            );

    } catch (error) {

        userData = null;
    }


    if (!userData) {

        userData = {

            pigs: [],

            feedingRecords: [],

            healthRecords: [],

            events: [],

            activities: []

        };

    }


    /* ==========================================
       MAKE SURE ARRAYS EXIST
    ========================================== */

    if (!Array.isArray(userData.pigs)) {
        userData.pigs = [];
    }

    if (!Array.isArray(userData.feedingRecords)) {
        userData.feedingRecords = [];
    }

    if (!Array.isArray(userData.healthRecords)) {
        userData.healthRecords = [];
    }

    if (!Array.isArray(userData.events)) {
        userData.events = [];
    }

    if (!Array.isArray(userData.activities)) {
        userData.activities = [];
    }


    /* ==========================================
       SAVE
    ========================================== */

    function saveUserData() {

        localStorage.setItem(
            dataKey,
            JSON.stringify(
                userData
            )
        );

    }


    saveUserData();


    /* ==========================================
       USER NAME
    ========================================== */

    const userName =
        document.getElementById(
            "userName"
        );


    const fullName =
        String(
            currentUser.fullName ||
            currentUser.name ||
            "User"
        ).trim();


    const firstName =
        fullName.split(/\s+/)[0] ||
        "User";


    userName.textContent =
        firstName;


    /* ==========================================
       STATISTICS
    ========================================== */

    const totalPigs =
        document.getElementById(
            "totalPigs"
        );

    const todayFeedings =
        document.getElementById(
            "todayFeedings"
        );

    const healthRecords =
        document.getElementById(
            "healthRecords"
        );

    const upcomingEvents =
        document.getElementById(
            "upcomingEvents"
        );


    function getToday() {

        const now =
            new Date();

        const year =
            now.getFullYear();

        const month =
            String(
                now.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                now.getDate()
            ).padStart(2, "0");

        return (
            year +
            "-" +
            month +
            "-" +
            day
        );

    }


    function countTodayFeedings() {

        const today =
            getToday();

        return userData.feedingRecords
            .filter(
                function (record) {

                    return (
                        record.date ===
                        today
                    );

                }
            )
            .length;

    }


    function countUpcomingEvents() {

        const today =
            getToday();

        return userData.events
            .filter(
                function (event) {

                    return (
                        event.date &&
                        event.date >= today
                    );

                }
            )
            .length;

    }


    function updateStatistics() {

        totalPigs.textContent =
            userData.pigs.length;

        todayFeedings.textContent =
            countTodayFeedings();

        healthRecords.textContent =
            userData.healthRecords.length;

        upcomingEvents.textContent =
            countUpcomingEvents();

    }


    /* ==========================================
       PIG SECTION
    ========================================== */

    const pigsEmptyState =
        document.getElementById(
            "pigsEmptyState"
        );


    function updatePigSection() {

        if (
            userData.pigs.length === 0
        ) {

            pigsEmptyState.style.display =
                "flex";

        } else {

            pigsEmptyState.style.display =
                "none";

        }

    }


    /* ==========================================
       ACTIVITY
    ========================================== */

    const activityList =
        document.getElementById(
            "activityList"
        );

    const activityEmpty =
        document.getElementById(
            "activityEmpty"
        );


    function getActivityIcon(type) {

        const activityType =
            String(type || "")
                .toLowerCase();


        if (
            activityType === "pig_added" ||
            activityType === "pig"
        ) {

            return "🐷";

        }


        if (
            activityType ===
                "pig_updated" ||
            activityType ===
                "pig_edited"
        ) {

            return "✏️";

        }


        if (
            activityType ===
                "pig_deleted"
        ) {

            return "🗑️";

        }


        if (
            activityType ===
                "feeding_added" ||
            activityType ===
                "feeding"
        ) {

            return "🍚";

        }


        if (
            activityType ===
                "health_added" ||
            activityType ===
                "health"
        ) {

            return "❤️";

        }


        if (
            activityType ===
                "event_added" ||
            activityType ===
                "calendar_added" ||
            activityType ===
                "calendar"
        ) {

            return "📅";

        }


        if (
            activityType ===
                "profile_updated" ||
            activityType ===
                "profile"
        ) {

            return "👤";

        }


        return "🔔";

    }


    function formatActivityTime(value) {

        if (!value) {
            return "Recently";
        }


        const date =
            new Date(value);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "Recently";

        }


        const now =
            new Date();


        const difference =
            now.getTime() -
            date.getTime();


        const seconds =
            Math.floor(
                difference / 1000
            );


        if (seconds < 60) {
            return "Just now";
        }


        const minutes =
            Math.floor(
                seconds / 60
            );


        if (minutes < 60) {

            return (
                minutes +
                (
                    minutes === 1
                        ? " minute ago"
                        : " minutes ago"
                )
            );

        }


        const hours =
            Math.floor(
                minutes / 60
            );


        if (hours < 24) {

            return (
                hours +
                (
                    hours === 1
                        ? " hour ago"
                        : " hours ago"
                )
            );

        }


        const days =
            Math.floor(
                hours / 24
            );


        if (days < 7) {

            return (
                days +
                (
                    days === 1
                        ? " day ago"
                        : " days ago"
                )
            );

        }


        return date.toLocaleDateString(
            "en-US",
            {
                month: "short",
                day: "numeric",
                year: "numeric"
            }
        );

    }


    function escapeHTML(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    function openActivity(activity) {

        const type =
            String(
                activity.type || ""
            ).toLowerCase();


        if (
            type.includes("pig")
        ) {

            window.location.href =
                "pigs.html";

            return;
        }


        if (
            type.includes("feed")
        ) {

            window.location.href =
                "feed.html";

            return;
        }


        if (
            type.includes("health")
        ) {

            window.location.href =
                "health.html";

            return;
        }


        if (
            type.includes("calendar") ||
            type.includes("event")
        ) {

            window.location.href =
                "calendar.html";

            return;
        }


        if (
            type.includes("profile")
        ) {

            window.location.href =
                "profile.html";

            return;
        }

    }


    function updateActivity() {

        activityList.innerHTML =
            "";


        if (
            !Array.isArray(
                userData.activities
            ) ||
            userData.activities.length === 0
        ) {

            activityEmpty.style.display =
                "block";

            return;

        }


        activityEmpty.style.display =
            "none";


        const activities =
            [...userData.activities]

                .sort(
                    function (a, b) {

                        const dateA =
                            new Date(
                                a.date ||
                                a.createdAt ||
                                0
                            ).getTime();


                        const dateB =
                            new Date(
                                b.date ||
                                b.createdAt ||
                                0
                            ).getTime();


                        return dateB - dateA;

                    }
                )

                .slice(0, 5);


        activities.forEach(
            function (activity) {

                const item =
                    document.createElement(
                        "button"
                    );


                item.type =
                    "button";


                item.className =
                    "activity-item";


                const icon =
                    getActivityIcon(
                        activity.type
                    );


                const text =
                    activity.text ||
                    activity.message ||
                    "Activity recorded";


                const time =
                    formatActivityTime(
                        activity.date ||
                        activity.createdAt
                    );


                item.innerHTML = `

                    <div class="activity-icon">
                        ${icon}
                    </div>

                    <div class="activity-info">

                        <div class="activity-text">
                            ${escapeHTML(text)}
                        </div>

                        <div class="activity-time">
                            ${escapeHTML(time)}
                        </div>

                    </div>

                    <div class="activity-arrow">
                        ›
                    </div>

                `;


                item.addEventListener(
                    "click",
                    function () {

                        openActivity(
                            activity
                        );

                    }
                );


                activityList.appendChild(
                    item
                );

            }
        );

    }


    /* ==========================================
       INITIAL DISPLAY
    ========================================== */

    updateStatistics();

    updatePigSection();

    updateActivity();


    /* ==========================================
       ADD PIG
    ========================================== */

    document
        .getElementById(
            "addPigButton"
        )
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "pigs.html";

            }
        );


    /* ==========================================
       VIEW PIGS
    ========================================== */

    document
        .getElementById(
            "viewPigsButton"
        )
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "pigs.html";

            }
        );


    /* ==========================================
       QUICK ACTIONS
    ========================================== */

    document
        .getElementById(
            "feedingButton"
        )
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "feed.html";

            }
        );


    document
        .getElementById(
            "healthButton"
        )
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "health.html";

            }
        );


    document
        .getElementById(
            "calendarButton"
        )
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "calendar.html";

            }
        );


    document
        .getElementById(
            "profileQuickButton"
        )
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "profile.html";

            }
        );


    /* ==========================================
       HEADER
    ========================================== */

    document
        .getElementById(
            "profileButton"
        )
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "profile.html";

            }
        );


    document
        .getElementById(
            "notificationButton"
        )
        .addEventListener(
            "click",
            function () {

                if (
                    userData.activities.length >
                    0
                ) {

                    alert(
                        "You have " +
                        userData.activities.length +
                        " recent activit" +
                        (
                            userData.activities.length === 1
                                ? "y."
                                : "ies."
                        )
                    );

                } else {

                    alert(
                        "You don't have any notifications yet."
                    );

                }

            }
        );


    /* ==========================================
       BOTTOM NAV
    ========================================== */

    document
        .querySelectorAll(
            ".nav-button"
        )
        .forEach(
            function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        const page =
                            button.dataset.page;


                        if (page) {

                            window.location.href =
                                page;

                        }

                    }
                );

            }
        );


    /* ==========================================
       REFRESH WHEN RETURNING TO HOME
    ========================================== */

    window.addEventListener(
        "pageshow",
        function () {

            let latestData = null;


            try {

                latestData =
                    JSON.parse(
                        localStorage.getItem(
                            dataKey
                        )
                    );

            } catch (error) {

                latestData = null;

            }


            if (latestData) {

                userData =
                    latestData;


                if (
                    !Array.isArray(
                        userData.pigs
                    )
                ) {

                    userData.pigs = [];

                }


                if (
                    !Array.isArray(
                        userData.feedingRecords
                    )
                ) {

                    userData.feedingRecords = [];

                }


                if (
                    !Array.isArray(
                        userData.healthRecords
                    )
                ) {

                    userData.healthRecords = [];

                }


                if (
                    !Array.isArray(
                        userData.events
                    )
                ) {

                    userData.events = [];

                }


                if (
                    !Array.isArray(
                        userData.activities
                    )
                ) {

                    userData.activities = [];

                }


                updateStatistics();

                updatePigSection();

                updateActivity();

            }

        }
    );


})();

</script>
