<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Feed Management | PorkyPal</title>

    <style>

        /* ==================================================
           RESET
        ================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            width: 100%;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #eee4e1;

            color: #493a36;

            display: flex;
            justify-content: center;

            overflow-x: hidden;
            overflow-y: auto;
        }

        button,
        input,
        select {
            font-family: inherit;
        }


        /* ==================================================
           PHONE
        ================================================== */

        .phone {
            width: 100%;
            max-width: 430px;

            min-height: 100vh;

            background: #fffaf8;

            position: relative;

            overflow: visible;
        }


        .page {
            width: 100%;

            min-height: 100vh;

            padding-bottom: 105px;

            background: #fffaf8;

            overflow: visible;
        }


        /* ==================================================
           HEADER
        ================================================== */

        .top-header {
            padding:
                19px
                18px
                9px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .header-left {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .back-button,
        .profile-button {

            width: 38px;
            height: 38px;

            border-radius: 12px;

            border:
                1px solid
                #efd9df;

            background: #ffffff;

            color: #e94b82;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        .back-button {
            font-size: 20px;
        }

        .profile-button {
            font-size: 17px;
        }

        .back-button:active,
        .profile-button:active {
            transform: scale(.95);
        }

        .page-title {
            font-size: 20px;

            font-weight: 900;

            color: #493a36;
        }

        .page-title span {
            color: #e94b82;
        }


        /* ==================================================
           CONTENT
        ================================================== */

        .content {
            width: 100%;

            padding:
                4px
                18px
                20px;

            overflow: visible;
        }


        /* ==================================================
           INTRO
        ================================================== */

        .intro {
            margin-bottom: 13px;
        }

        .intro-title {
            font-size: 24px;

            font-weight: 900;

            color: #493a36;
        }

        .intro-text {
            margin-top: 4px;

            color: #a18f89;

            font-size: 9px;

            line-height: 1.5;
        }


        /* ==================================================
           ADD BUTTON
        ================================================== */

        .add-button {

            width: 100%;

            height: 45px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #f55b91,
                    #e8417b
                );

            color: white;

            font-size: 11px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 7px 16px
                rgba(
                    239,
                    79,
                    135,
                    .20
                );

            margin-bottom: 18px;
        }

        .add-button:active {
            transform: scale(.98);
        }


        /* ==================================================
           SECTION HEADER
        ================================================== */

        .section-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 9px;
        }

        .section-title {

            font-size: 14px;

            font-weight: 900;

            color: #493a36;
        }

        .section-count {

            min-width: 24px;

            height: 23px;

            padding: 0 7px;

            border-radius: 12px;

            background: #ffe7ef;

            color: #e94b82;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 8px;

            font-weight: 900;
        }


        /* ==================================================
           SCHEDULE FILTER
        ================================================== */

        .schedule-tabs {

            width: 100%;

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 8px;

            margin-bottom: 11px;
        }

        .schedule-tab {

            height: 35px;

            border:
                1px solid
                #efdce2;

            border-radius: 11px;

            background: white;

            color: #a18f89;

            font-size: 9px;

            font-weight: 800;

            cursor: pointer;
        }

        .schedule-tab.active {

            border-color: #ef78a0;

            background: #ffe8ef;

            color: #e94b82;
        }


        /* ==================================================
           SCHEDULE LIST
        ================================================== */

        .schedule-list {

            display: flex;

            flex-direction: column;

            gap: 9px;
        }


        /* ==================================================
           SCHEDULE CARD
        ================================================== */

        .schedule-card {

            width: 100%;

            min-height: 82px;

            border:
                1px solid
                #f0dfe3;

            border-radius: 17px;

            background: #ffffff;

            padding:
                10px
                11px;

            display: flex;

            align-items: center;

            gap: 10px;

            cursor: pointer;

            text-align: left;

            box-shadow:
                0 4px 13px
                rgba(
                    80,
                    48,
                    43,
                    .035
                );

            transition:
                transform .15s ease,
                background .15s ease;
        }

        .schedule-card:active {

            transform: scale(.985);

            background: #fff6f8;
        }


        /* ==================================================
           TIME
        ================================================== */

        .schedule-time {

            width: 53px;

            flex-shrink: 0;

            text-align: center;
        }

        .schedule-hour {

            font-size: 13px;

            font-weight: 900;

            color: #493a36;
        }

        .schedule-period {

            margin-top: 2px;

            font-size: 7px;

            color: #e94b82;

            font-weight: 900;
        }


        /* ==================================================
           PIG ICON
        ================================================== */

        .schedule-pig {

            width: 45px;
            height: 45px;

            flex-shrink: 0;

            border-radius: 13px;

            background: #ffe8ef;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;
        }


        /* ==================================================
           SCHEDULE INFO
        ================================================== */

        .schedule-info {

            flex: 1;

            min-width: 0;
        }

        .schedule-pig-name {

            font-size: 11px;

            font-weight: 900;

            color: #493a36;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .schedule-feed-name {

            margin-top: 4px;

            font-size: 8px;

            color: #9e8c86;
        }

        .schedule-meta {

            display: flex;

            flex-wrap: wrap;

            gap: 4px;

            margin-top: 5px;
        }

        .meta-tag {

            padding:
                3px
                6px;

            border-radius: 6px;

            background: #fff3e3;

            color: #9b764e;

            font-size: 7px;

            font-weight: 800;
        }


        /* ==================================================
           STATUS
        ================================================== */

        .schedule-status {

            flex-shrink: 0;

            padding:
                5px
                7px;

            border-radius: 7px;

            font-size: 7px;

            font-weight: 900;

            background: #eaf7ec;

            color: #68a273;
        }

        .schedule-status.upcoming {

            background: #fff0f4;

            color: #e94b82;
        }

        .schedule-status.completed {

            background: #edf3ff;

            color: #6c82b1;
        }


        /* ==================================================
           EMPTY SCHEDULE
        ================================================== */

        .empty-schedule {

            width: 100%;

            min-height: 135px;

            border:
                1px dashed
                #eacbd5;

            border-radius: 17px;

            background: #fffdfc;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 20px;
        }

        .empty-icon {
            font-size: 28px;

            margin-bottom: 6px;
        }

        .empty-title {

            font-size: 11px;

            font-weight: 900;

            color: #594741;
        }

        .empty-text {

            margin-top: 5px;

            font-size: 8px;

            color: #a3918b;

            line-height: 1.5;
        }


        /* ==================================================
           FEEDING LOG
        ================================================== */

        .feeding-log-section {
            margin-top: 22px;
        }

        .feeding-log {

            display: flex;

            flex-direction: column;

            gap: 8px;
        }

        .feeding-record {

            width: 100%;

            min-height: 66px;

            border:
                1px solid
                #f0dfe3;

            border-radius: 15px;

            background: #ffffff;

            padding:
                9px
                11px;

            display: flex;

            align-items: center;

            gap: 10px;

            cursor: pointer;

            text-align: left;
        }

        .feeding-record:active {

            transform: scale(.985);

            background: #fff6f8;
        }

        .record-icon {

            width: 39px;
            height: 39px;

            flex-shrink: 0;

            border-radius: 12px;

            background: #fff1da;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 18px;
        }

        .record-info {

            flex: 1;

            min-width: 0;
        }

        .record-name {

            font-size: 10px;

            font-weight: 900;

            color: #493a36;
        }

        .record-details {

            margin-top: 4px;

            color: #a18f89;

            font-size: 7px;
        }

        .record-arrow {

            color: #c4aaa9;

            font-size: 19px;
        }


        /* ==================================================
           MODAL
        ================================================== */

        .modal-overlay {

            position: fixed;

            inset: 0;

            z-index: 100;

            background:
                rgba(
                    50,
                    30,
                    27,
                    .42
                );

            display: none;

            align-items: flex-end;

            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {

            width: 100%;

            max-width: 430px;

            max-height: 90vh;

            overflow-y: auto;

            background: #fffaf8;

            border-radius:
                25px
                25px
                0
                0;

            padding:
                20px
                18px
                28px;

            animation:
                slideUp .2s ease;
        }

        @keyframes slideUp {

            from {
                transform:
                    translateY(100%);
            }

            to {
                transform:
                    translateY(0);
            }
        }

        .modal-handle {

            width: 38px;

            height: 4px;

            border-radius: 10px;

            background: #dfccc8;

            margin:
                0 auto
                17px;
        }

        .modal-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 16px;
        }

        .modal-title {

            font-size: 18px;

            font-weight: 900;

            color: #493a36;
        }

        .close-modal {

            width: 33px;
            height: 33px;

            border-radius: 10px;

            border:
                1px solid
                #efdce2;

            background: white;

            color: #8e7a74;

            font-size: 18px;

            cursor: pointer;
        }


        /* ==================================================
           FORM
        ================================================== */

        .form-group {
            margin-bottom: 12px;
        }

        .form-label {

            display: block;

            margin-bottom: 5px;

            font-size: 9px;

            font-weight: 800;

            color: #594741;
        }

        .form-input,
        .form-select {

            width: 100%;

            height: 43px;

            border:
                1.5px solid
                #efdce2;

            border-radius: 12px;

            background: white;

            color: #493a36;

            outline: none;

            padding:
                0 11px;

            font-size: 10px;
        }

        .form-input:focus,
        .form-select:focus {

            border-color:
                #ed7da2;

            box-shadow:
                0 0 0 3px
                rgba(
                    239,
                    79,
                    135,
                    .08
                );
        }

        .form-row {

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 9px;
        }

        .save-button {

            width: 100%;

            height: 45px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #f65b91,
                    #e9417b
                );

            color: white;

            font-size: 11px;

            font-weight: 900;

            cursor: pointer;

            margin-top: 5px;
        }


        /* ==================================================
           DETAILS
        ================================================== */

        .details-icon {

            width: 70px;
            height: 70px;

            margin:
                0 auto
                11px;

            border-radius: 22px;

            background: #fff0d9;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 34px;
        }

        .details-pig-name {

            text-align: center;

            font-size: 19px;

            font-weight: 900;

            color: #493a36;
        }

        .details-subtitle {

            text-align: center;

            margin-top: 4px;

            color: #a3918b;

            font-size: 8px;
        }

        .details-grid {

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 8px;

            margin-top: 18px;
        }

        .details-box {

            padding: 11px;

            border:
                1px solid
                #f0dfe3;

            border-radius: 13px;

            background: white;
        }

        .details-label {

            font-size: 7px;

            color: #a3918b;
        }

        .details-value {

            margin-top: 4px;

            font-size: 10px;

            font-weight: 900;

            color: #493a36;

            word-break: break-word;
        }

        .delete-button {

            width: 100%;

            height: 43px;

            margin-top: 17px;

            border:
                1px solid
                #efcbd3;

            border-radius: 13px;

            background: #fff6f7;

            color: #d85d72;

            font-size: 9px;

            font-weight: 900;

            cursor: pointer;
        }


        /* ==================================================
           BOTTOM NAV
        ================================================== */

        .bottom-nav {

            position: fixed;

            left: 50%;

            bottom: 0;

            transform:
                translateX(-50%);

            width: 100%;

            max-width: 430px;

            height: 72px;

            background:
                rgba(
                    255,
                    250,
                    248,
                    .98
                );

            border-top:
                1px solid
                #f0dfe3;

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            z-index: 50;

            padding-bottom: 4px;
        }

        .nav-button {

            border: none;

            background: transparent;

            cursor: pointer;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 4px;

            color: #a99a95;

            font-size: 9px;

            font-weight: 600;
        }

        .nav-icon {

            width: 29px;
            height: 29px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            font-size: 17px;
        }

        .nav-button.active {

            color: #e94b82;
        }

        .nav-button.active .nav-icon {

            background: #ffe6ee;
        }


        /* ==================================================
           RESPONSIVE
        ================================================== */

        @media (min-width: 600px) {

            body {

                align-items: flex-start;

                padding: 20px 0;
            }

            .phone {

                min-height:
                    calc(100vh - 40px);

                border-radius: 35px;

                box-shadow:
                    0 20px 60px
                    rgba(
                        70,
                        45,
                        38,
                        .18
                    );
            }

            .page {

                min-height:
                    calc(100vh - 40px);

                border-radius: 35px;
            }
        }

    </style>

</head>


<body>


<div class="phone">


    <main class="page">


        <!-- ==================================================
             HEADER
        ================================================== -->

        <header class="top-header">

            <div class="header-left">

                <button
                    type="button"
                    class="back-button"
                    id="backButton">

                    ←

                </button>


                <div class="page-title">

                    Feed
                    <span>Management</span>

                </div>

            </div>


            <button
                type="button"
                class="profile-button"
                id="profileButton">

                👤

            </button>

        </header>


        <!-- ==================================================
             CONTENT
        ================================================== -->

        <section class="content">


            <div class="intro">

                <div class="intro-title">
                    Feeding Schedule
                </div>

                <div class="intro-text">
                    Keep track of your pigs' feeding
                    schedules and feeding records.
                </div>

            </div>


            <!-- ADD FEEDING -->

            <button
                type="button"
                class="add-button"
                id="addButton">

                ＋ Add Feeding

            </button>


            <!-- ==================================================
                 SCHEDULE
            ================================================== -->

            <div class="section-header">

                <div class="section-title">
                    Feeding Schedule
                </div>

                <div
                    class="section-count"
                    id="scheduleCount">

                    0

                </div>

            </div>


            <div class="schedule-tabs">

                <button
                    type="button"
                    class="schedule-tab active"
                    id="todayTab">

                    Today

                </button>


                <button
                    type="button"
                    class="schedule-tab"
                    id="upcomingTab">

                    Upcoming

                </button>

            </div>


            <div
                class="schedule-list"
                id="scheduleList">
            </div>


            <div
                class="empty-schedule"
                id="emptySchedule">

                <div class="empty-icon">
                    🍚
                </div>

                <div class="empty-title">
                    No feeding schedule yet
                </div>

                <div class="empty-text">
                    Add a feeding schedule for
                    your pigs.
                </div>

            </div>


            <!-- ==================================================
                 FEEDING LOG
            ================================================== -->

            <div class="feeding-log-section">

                <div class="section-header">

                    <div class="section-title">
                        Feeding Log
                    </div>

                    <div
                        class="section-count"
                        id="feedingCount">

                        0

                    </div>

                </div>


                <div
                    class="feeding-log"
                    id="feedingLog">
                </div>


            </div>


        </section>


    </main>


    <!-- ==================================================
         ADD FEEDING MODAL
    ================================================== -->

    <div
        class="modal-overlay"
        id="formModal">


        <div class="modal">


            <div class="modal-handle"></div>


            <div class="modal-header">

                <div class="modal-title">
                    Add Feeding
                </div>


                <button
                    type="button"
                    class="close-modal"
                    id="closeFormModal">

                    ×

                </button>

            </div>


            <form id="feedingForm">


                <div class="form-group">

                    <label
                        class="form-label"
                        for="pigSelect">

                        Pig

                    </label>


                    <select
                        id="pigSelect"
                        class="form-select"
                        required>

                        <option value="">
                            Select pig
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label
                        class="form-label"
                        for="feedType">

                        Feed Type

                    </label>


                    <select
                        id="feedType"
                        class="form-select"
                        required>

                        <option value="">
                            Select feed type
                        </option>

                        <option value="Starter">
                            Starter
                        </option>

                        <option value="Grower">
                            Grower
                        </option>

                        <option value="Finisher">
                            Finisher
                        </option>

                        <option value="Sow Feed">
                            Sow Feed
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label
                            class="form-label"
                            for="feedAmount">

                            Amount (kg)

                        </label>


                        <input
                            type="number"
                            id="feedAmount"
                            class="form-input"
                            placeholder="e.g. 2"
                            min="0.1"
                            step="0.1"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label
                            class="form-label"
                            for="feedTime">

                            Time

                        </label>


                        <input
                            type="time"
                            id="feedTime"
                            class="form-input"
                            required
                        >

                    </div>


                </div>


                <div class="form-group">

                    <label
                        class="form-label"
                        for="feedDate">

                        Date

                    </label>


                    <input
                        type="date"
                        id="feedDate"
                        class="form-input"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="save-button">

                    Save Feeding Schedule

                </button>


            </form>


        </div>

    </div>


    <!-- ==================================================
         FEEDING DETAILS MODAL
    ================================================== -->

    <div
        class="modal-overlay"
        id="detailsModal">


        <div class="modal">


            <div class="modal-handle"></div>


            <div class="modal-header">

                <div class="modal-title">
                    Feeding Schedule
                </div>


                <button
                    type="button"
                    class="close-modal"
                    id="closeDetailsModal">

                    ×

                </button>

            </div>


            <div class="details-icon">
                🍚
            </div>


            <div
                class="details-pig-name"
                id="detailsPigName">

                Pig

            </div>


            <div
                class="details-subtitle"
                id="detailsSubtitle">

                Feeding Schedule

            </div>


            <div class="details-grid">


                <div class="details-box">

                    <div class="details-label">
                        Feed Type
                    </div>

                    <div
                        class="details-value"
                        id="detailsFeedType">

                        -

                    </div>

                </div>


                <div class="details-box">

                    <div class="details-label">
                        Amount
                    </div>

                    <div
                        class="details-value"
                        id="detailsAmount">

                        -

                    </div>

                </div>


                <div class="details-box">

                    <div class="details-label">
                        Date
                    </div>

                    <div
                        class="details-value"
                        id="detailsDate">

                        -

                    </div>

                </div>


                <div class="details-box">

                    <div class="details-label">
                        Time
                    </div>

                    <div
                        class="details-value"
                        id="detailsTime">

                        -

                    </div>

                </div>


                <div class="details-box">

                    <div class="details-label">
                        Status
                    </div>

                    <div
                        class="details-value"
                        id="detailsStatus">

                        -

                    </div>

                </div>


                <div class="details-box">

                    <div class="details-label">
                        Created
                    </div>

                    <div
                        class="details-value"
                        id="detailsCreated">

                        -

                    </div>

                </div>


            </div>


            <button
                type="button"
                class="delete-button"
                id="deleteButton">

                🗑 Delete Feeding Schedule

            </button>


        </div>

    </div>


    <!-- ==================================================
         BOTTOM NAV
    ================================================== -->

    <nav class="bottom-nav">


        <button
            type="button"
            class="nav-button"
            data-page="home.html">

            <div class="nav-icon">
                🏠
            </div>

            <span>
                Home
            </span>

        </button>


        <button
            type="button"
            class="nav-button"
            data-page="pigs.html">

            <div class="nav-icon">
                🐷
            </div>

            <span>
                Pigs
            </span>

        </button>


        <button
            type="button"
            class="nav-button active"
            data-page="feed.html">

            <div class="nav-icon">
                🍚
            </div>

            <span>
                Feed
            </span>

        </button>


        <button
            type="button"
            class="nav-button"
            data-page="health.html">

            <div class="nav-icon">
                ❤️
            </div>

            <span>
                Health
            </span>

        </button>


        <button
            type="button"
            class="nav-button"
            data-page="profile.html">

            <div class="nav-icon">
                👤
            </div>

            <span>
                Profile
            </span>

        </button>


    </nav>


</div>


<script>

(function () {


    /* ==================================================
       LOGIN CHECK
    ================================================== */

    const loggedIn =
        localStorage.getItem(
            "porkyPalLoggedIn"
        );

    const currentUserRaw =
        localStorage.getItem(
            "porkyPalCurrentUser"
        );


    if (
        loggedIn !== "true" ||
        !currentUserRaw
    ) {

        window.location.replace(
            "login.html"
        );

        return;
    }


    let currentUser;


    try {

        currentUser =
            JSON.parse(
                currentUserRaw
            );

    } catch (error) {

        window.location.replace(
            "login.html"
        );

        return;
    }


    const email =
        String(
            currentUser.email || ""
        )
        .trim()
        .toLowerCase();


    if (!email) {

        window.location.replace(
            "login.html"
        );

        return;
    }


    /* ==================================================
       USER DATA
    ================================================== */

    const dataKey =
        "porkyPal_homeData_" +
        encodeURIComponent(email);


    let userData;


    try {

        userData =
            JSON.parse(
                localStorage.getItem(
                    dataKey
                )
            );

    } catch (error) {

        userData = null;

    }


    if (!userData) {

        userData = {

            pigs: [],

            feedingRecords: [],

            healthRecords: [],

            events: [],

            activities: []

        };

    }


    if (!Array.isArray(userData.pigs)) {
        userData.pigs = [];
    }

    if (!Array.isArray(userData.feedingRecords)) {
        userData.feedingRecords = [];
    }

    if (!Array.isArray(userData.healthRecords)) {
        userData.healthRecords = [];
    }

    if (!Array.isArray(userData.events)) {
        userData.events = [];
    }

    if (!Array.isArray(userData.activities)) {
        userData.activities = [];
    }


    function saveData() {

        localStorage.setItem(
            dataKey,
            JSON.stringify(
                userData
            )
        );

    }


    /* ==================================================
       ELEMENTS
    ================================================== */

    const scheduleList =
        document.getElementById(
            "scheduleList"
        );

    const emptySchedule =
        document.getElementById(
            "emptySchedule"
        );

    const scheduleCount =
        document.getElementById(
            "scheduleCount"
        );

    const feedingLog =
        document.getElementById(
            "feedingLog"
        );

    const feedingCount =
        document.getElementById(
            "feedingCount"
        );

    const formModal =
        document.getElementById(
            "formModal"
        );

    const detailsModal =
        document.getElementById(
            "detailsModal"
        );


    let selectedRecordId = null;

    let currentFilter = "today";


    /* ==================================================
       DATE HELPERS
    ================================================== */

    function getTodayString() {

        const now =
            new Date();

        const year =
            now.getFullYear();

        const month =
            String(
                now.getMonth() + 1
            )
            .padStart(2, "0");

        const day =
            String(
                now.getDate()
            )
            .padStart(2, "0");


        return (
            year +
            "-" +
            month +
            "-" +
            day
        );

    }


    function formatDate(value) {

        if (!value) {
            return "Not set";
        }


        const date =
            new Date(
                value + "T00:00:00"
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return value;

        }


        return date.toLocaleDateString(
            "en-US",
            {
                month: "short",
                day: "numeric",
                year: "numeric"
            }
        );

    }


    function formatTime(value) {

        if (!value) {
            return "Not set";
        }


        const parts =
            String(value)
                .split(":");


        let hour =
            Number(
                parts[0]
            );

        const minute =
            parts[1] || "00";


        const period =
            hour >= 12
                ? "PM"
                : "AM";


        hour =
            hour % 12;


        if (hour === 0) {
            hour = 12;
        }


        return (
            hour +
            ":" +
            minute +
            " " +
            period
        );

    }


    function getRecordStatus(record) {

        const today =
            getTodayString();


        if (
            record.date <
            today
        ) {

            return "Completed";

        }


        if (
            record.date >
            today
        ) {

            return "Upcoming";

        }


        if (!record.time) {

            return "Today";

        }


        const now =
            new Date();


        const parts =
            record.time.split(":");


        const recordDate =
            new Date();


        recordDate.setHours(
            Number(parts[0]),
            Number(parts[1]),
            0,
            0
        );


        if (
            recordDate.getTime() <
            now.getTime()
        ) {

            return "Completed";

        }


        return "Upcoming";

    }


    /* ==================================================
       ESCAPE
    ================================================== */

    function escapeHTML(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* ==================================================
       GET PIG NAME
    ================================================== */

    function getPigName(record) {

        if (record.pigName) {

            return record.pigName;

        }


        const pig =
            userData.pigs.find(
                function (item) {

                    return (
                        item.id ===
                        record.pigId
                    );

                }
            );


        return pig
            ? pig.name
            : "Unknown Pig";

    }


    /* ==================================================
       RENDER SCHEDULE
    ================================================== */

    function renderSchedule() {

        scheduleList.innerHTML =
            "";


        let records =
            [...userData.feedingRecords];


        const today =
            getTodayString();


        if (
            currentFilter ===
            "today"
        ) {

            records =
                records.filter(
                    function (record) {

                        return (
                            record.date ===
                            today
                        );

                    }
                );

        } else {

            records =
                records.filter(
                    function (record) {

                        return (
                            record.date >
                            today
                        );

                    }
                );

        }


        records.sort(
            function (a, b) {

                const first =
                    (
                        a.date ||
                        ""
                    ) +
                    " " +
                    (
                        a.time ||
                        ""
                    );


                const second =
                    (
                        b.date ||
                        ""
                    ) +
                    " " +
                    (
                        b.time ||
                        ""
                    );


                return first.localeCompare(
                    second
                );

            }
        );


        scheduleCount.textContent =
            records.length;


        if (
            records.length === 0
        ) {

            emptySchedule.style.display =
                "flex";

            return;

        }


        emptySchedule.style.display =
            "none";


        records.forEach(
            function (record) {


                const status =
                    getRecordStatus(
                        record
                    );


                const statusClass =
                    status ===
                    "Upcoming"
                        ? "upcoming"
                        : status ===
                          "Completed"
                            ? "completed"
                            : "";


                const card =
                    document.createElement(
                        "button"
                    );


                card.type =
                    "button";


                card.className =
                    "schedule-card";


                card.innerHTML = `

                    <div class="schedule-time">

                        <div class="schedule-hour">
                            ${escapeHTML(
                                formatTime(
                                    record.time
                                )
                            )}
                        </div>

                    </div>


                    <div class="schedule-pig">
                        🐷
                    </div>


                    <div class="schedule-info">

                        <div class="schedule-pig-name">
                            ${escapeHTML(
                                getPigName(
                                    record
                                )
                            )}
                        </div>


                        <div class="schedule-feed-name">
                            Feeding Schedule
                        </div>


                        <div class="schedule-meta">

                            <span class="meta-tag">
                                ${escapeHTML(
                                    record.amount
                                )} kg
                            </span>

                            <span class="meta-tag">
                                ${escapeHTML(
                                    record.type ||
                                    "Feed"
                                )}
                            </span>

                        </div>

                    </div>


                    <div
                        class="schedule-status
                        ${statusClass}">

                        ${status}

                    </div>

                `;


                card.addEventListener(
                    "click",
                    function () {

                        openDetails(
                            record
                        );

                    }
                );


                scheduleList.appendChild(
                    card
                );

            }
        );

    }


    /* ==================================================
       RENDER FEEDING LOG
    ================================================== */

    function renderFeedingLog() {

        feedingLog.innerHTML =
            "";


        feedingCount.textContent =
            userData.feedingRecords.length;


        if (
            userData.feedingRecords.length ===
            0
        ) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "empty-schedule";


            empty.innerHTML = `

                <div class="empty-icon">
                    🍚
                </div>

                <div class="empty-title">
                    No feeding records yet
                </div>

                <div class="empty-text">
                    Add a feeding schedule above.
                </div>

            `;


            feedingLog.appendChild(
                empty
            );

            return;
        }


        const records =
            [...userData.feedingRecords]
                .sort(
                    function (a, b) {

                        return (
                            new Date(
                                b.createdAt ||
                                0
                            ).getTime()
                            -
                            new Date(
                                a.createdAt ||
                                0
                            ).getTime()
                        );

                    }
                );


        records.forEach(
            function (record) {


                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.className =
                    "feeding-record";


                button.innerHTML = `

                    <div class="record-icon">
                        🍚
                    </div>


                    <div class="record-info">

                        <div class="record-name">
                            ${escapeHTML(
                                getPigName(
                                    record
                                )
                            )}
                        </div>


                        <div class="record-details">

                            ${escapeHTML(
                                record.type ||
                                "Feed"
                            )}

                            •

                            ${escapeHTML(
                                record.amount
                            )} kg

                            •

                            ${escapeHTML(
                                formatDate(
                                    record.date
                                )
                            )}

                            •

                            ${escapeHTML(
                                formatTime(
                                    record.time
                                )
                            )}

                        </div>

                    </div>


                    <div class="record-arrow">
                        ›
                    </div>

                `;


                button.addEventListener(
                    "click",
                    function () {

                        openDetails(
                            record
                        );

                    }
                );


                feedingLog.appendChild(
                    button
                );

            }
        );

    }


    /* ==================================================
       OPEN ADD MODAL
    ================================================== */

    function openAddModal() {

        const pigSelect =
            document.getElementById(
                "pigSelect"
            );


        pigSelect.innerHTML = `

            <option value="">
                Select pig
            </option>

        `;


        userData.pigs.forEach(
            function (pig) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    pig.id;


                option.textContent =
                    pig.name;


                pigSelect.appendChild(
                    option
                );

            }
        );


        if (
            userData.pigs.length === 0
        ) {

            alert(
                "Please add a pig first."
            );

            window.location.href =
                "pigs.html";

            return;
        }


        document
            .getElementById(
                "feedingForm"
            )
            .reset();


        const now =
            new Date();


        document
            .getElementById(
                "feedDate"
            )
            .value =
            getTodayString();


        document
            .getElementById(
                "feedTime"
            )
            .value =
            String(
                now.getHours()
            )
            .padStart(2, "0") +
            ":" +
            String(
                now.getMinutes()
            )
            .padStart(2, "0");


        formModal.classList.add(
            "show"
        );

    }


    document
        .getElementById(
            "addButton"
        )
        .addEventListener(
            "click",
            openAddModal
        );


    /* ==================================================
       CLOSE ADD MODAL
    ================================================== */

    function closeFormModal() {

        formModal.classList.remove(
            "show"
        );

    }


    document
        .getElementById(
            "closeFormModal"
        )
        .addEventListener(
            "click",
            closeFormModal
        );


    formModal.addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                formModal
            ) {

                closeFormModal();

            }

        }
    );


    /* ==================================================
       SAVE FEEDING
    ================================================== */

    document
        .getElementById(
            "feedingForm"
        )
        .addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const pigId =
                    document
                        .getElementById(
                            "pigSelect"
                        )
                        .value;


                const type =
                    document
                        .getElementById(
                            "feedType"
                        )
                        .value;


                const amount =
                    document
                        .getElementById(
                            "feedAmount"
                        )
                        .value
                        .trim();


                const time =
                    document
                        .getElementById(
                            "feedTime"
                        )
                        .value;


                const date =
                    document
                        .getElementById(
                            "feedDate"
                        )
                        .value;


                if (
                    !pigId ||
                    !type ||
                    !amount ||
                    !time ||
                    !date
                ) {

                    alert(
                        "Please complete all feeding information."
                    );

                    return;
                }


                const pig =
                    userData.pigs.find(
                        function (item) {

                            return (
                                item.id ===
                                pigId
                            );

                        }
                    );


                if (!pig) {

                    alert(
                        "Pig not found."
                    );

                    return;
                }


                const record = {

                    id:
                        "feeding_" +
                        Date.now() +
                        "_" +
                        Math.random()
                            .toString(36)
                            .substring(2, 8),

                    pigId:
                        pig.id,

                    pigName:
                        pig.name,

                    type:
                        type,

                    amount:
                        amount,

                    time:
                        time,

                    date:
                        date,

                    createdAt:
                        new Date()
                            .toISOString()

                };


                userData.feedingRecords.push(
                    record
                );


                /* ==================================================
                   RECENT ACTIVITY
                ================================================== */

                userData.activities.unshift({

                    id:
                        "activity_" +
                        Date.now() +
                        "_" +
                        Math.random()
                            .toString(36)
                            .substring(2, 8),

                    type:
                        "feeding_added",

                    text:
                        "Added feeding schedule for " +
                        pig.name,

                    date:
                        new Date()
                            .toISOString(),

                    recordId:
                        record.id

                });


                if (
                    userData.activities.length >
                    50
                ) {

                    userData.activities =
                        userData.activities
                            .slice(
                                0,
                                50
                            );

                }


                saveData();


                closeFormModal();


                renderSchedule();

                renderFeedingLog();


                alert(
                    "Feeding schedule added successfully!"
                );

            }
        );


    /* ==================================================
       OPEN DETAILS
    ================================================== */

    function openDetails(record) {

        selectedRecordId =
            record.id;


        document
            .getElementById(
                "detailsPigName"
            )
            .textContent =
            getPigName(
                record
            );


        document
            .getElementById(
                "detailsFeedType"
            )
            .textContent =
            record.type ||
            "Feed";


        document
            .getElementById(
                "detailsAmount"
            )
            .textContent =
            (
                record.amount ||
                "0"
            ) +
            " kg";


        document
            .getElementById(
                "detailsDate"
            )
            .textContent =
            formatDate(
                record.date
            );


        document
            .getElementById(
                "detailsTime"
            )
            .textContent =
            formatTime(
                record.time
            );


        document
            .getElementById(
                "detailsStatus"
            )
            .textContent =
            getRecordStatus(
                record
            );


        document
            .getElementById(
                "detailsCreated"
            )
            .textContent =
            record.createdAt
                ? new Date(
                    record.createdAt
                ).toLocaleDateString(
                    "en-US",
                    {
                        month: "short",
                        day: "numeric",
                        year: "numeric"
                    }
                )
                : "Not available";


        detailsModal.classList.add(
            "show"
        );

    }


    /* ==================================================
       CLOSE DETAILS
    ================================================== */

    function closeDetails() {

        detailsModal.classList.remove(
            "show"
        );

        selectedRecordId =
            null;

    }


    document
        .getElementById(
            "closeDetailsModal"
        )
        .addEventListener(
            "click",
            closeDetails
        );


    detailsModal.addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                detailsModal
            ) {

                closeDetails();

            }

        }
    );


    /* ==================================================
       DELETE
    ================================================== */

    document
        .getElementById(
            "deleteButton"
        )
        .addEventListener(
            "click",
            function () {


                if (!selectedRecordId) {
                    return;
                }


                const record =
                    userData.feedingRecords.find(
                        function (item) {

                            return (
                                item.id ===
                                selectedRecordId
                            );

                        }
                    );


                if (!record) {

                    alert(
                        "Feeding schedule not found."
                    );

                    return;
                }


                const confirmed =
                    confirm(
                        "Delete this feeding schedule?"
                    );


                if (!confirmed) {
                    return;
                }


                userData.feedingRecords =
                    userData.feedingRecords.filter(
                        function (item) {

                            return (
                                item.id !==
                                selectedRecordId
                            );

                        }
                    );


                userData.activities.unshift({

                    id:
                        "activity_" +
                        Date.now() +
                        "_" +
                        Math.random()
                            .toString(36)
                            .substring(2, 8),

                    type:
                        "feeding_deleted",

                    text:
                        "Deleted feeding schedule for " +
                        getPigName(
                            record
                        ),

                    date:
                        new Date()
                            .toISOString(),

                    recordId:
                        record.id

                });


                if (
                    userData.activities.length >
                    50
                ) {

                    userData.activities =
                        userData.activities
                            .slice(
                                0,
                                50
                            );

                }


                saveData();


                closeDetails();


                renderSchedule();

                renderFeedingLog();


                alert(
                    "Feeding schedule deleted."
                );

            }
        );


    /* ==================================================
       TABS
    ================================================== */

    document
        .getElementById(
            "todayTab"
        )
        .addEventListener(
            "click",
            function () {

                currentFilter =
                    "today";


                document
                    .getElementById(
                        "todayTab"
                    )
                    .classList.add(
                        "active"
                    );


                document
                    .getElementById(
                        "upcomingTab"
                    )
                    .classList.remove(
                        "active"
                    );


                renderSchedule();

            }
        );


    document
        .getElementById(
            "upcomingTab"
        )
        .addEventListener(
            "click",
            function () {

                currentFilter =
                    "upcoming";


                document
                    .getElementById(
                        "upcomingTab"
                    )
                    .classList.add(
                        "active"
                    );


                document
                    .getElementById(
                        "todayTab"
                    )
                    .classList.remove(
                        "active"
                    );


                renderSchedule();

            }
        );


    /* ==================================================
       BACK
    ================================================== */

    document
        .getElementById(
            "backButton"
        )
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "home.html";

            }
        );


    /* ==================================================
       PROFILE
    ================================================== */

    document
        .getElementById(
            "profileButton"
        )
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "profile.html";

            }
        );


    /* ==================================================
       BOTTOM NAV
    ================================================== */

    document
        .querySelectorAll(
            ".nav-button"
        )
        .forEach(
            function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        const page =
                            button.dataset.page;


                        if (page) {

                            window.location.href =
                                page;

                        }

                    }
                );

            }
        );


    /* ==================================================
       REFRESH WHEN RETURNING
    ================================================== */

    window.addEventListener(
        "pageshow",
        function () {

            try {

                const latest =
                    JSON.parse(
                        localStorage.getItem(
                            dataKey
                        )
                    );


                if (latest) {

                    userData =
                        latest;


                    if (
                        !Array.isArray(
                            userData.pigs
                        )
                    ) {

                        userData.pigs = [];

                    }


                    if (
                        !Array.isArray(
                            userData.feedingRecords
                        )
                    ) {

                        userData.feedingRecords = [];

                    }


                    if (
                        !Array.isArray(
                            userData.activities
                        )
                    ) {

                        userData.activities = [];

                    }


                    renderSchedule();

                    renderFeedingLog();

                }

            } catch (error) {

                console.log(
                    "Unable to refresh feed data."
                );

            }

        }
    );


    /* ==================================================
       INITIAL LOAD
    ================================================== */

    renderSchedule();

    renderFeedingLog();


})();

</script>


</body>

</html>
