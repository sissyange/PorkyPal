<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>My Pigs | PorkyPal</title>

    <style>

        /* ==========================================
           RESET
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #eee4e1;

            color: #493a36;

            display: flex;
            justify-content: center;

            overflow-x: hidden;
            overflow-y: auto;
        }

        button,
        input,
        select {
            font-family: inherit;
        }


        /* ==========================================
           PHONE
        ========================================== */

        .phone {
            width: 100%;
            max-width: 430px;

            min-height: 100vh;
            height: auto;

            background: #fffaf8;

            position: relative;

            overflow: visible;
        }


        /* ==========================================
           PAGE
        ========================================== */

        .page {
            width: 100%;

            min-height: 100vh;
            height: auto;

            padding-bottom: 105px;

            background: #fffaf8;

            overflow: visible;
        }


        /* ==========================================
           HEADER
        ========================================== */

        .top-header {

            padding:
                20px
                18px
                12px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .header-left {

            display: flex;

            align-items: center;

            gap: 11px;
        }

        .back-button,
        .profile-button {

            width: 39px;
            height: 39px;

            border-radius: 13px;

            border:
                1px solid
                #efd9df;

            background: #ffffff;

            color: #e94b82;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            box-shadow:
                0 3px 10px
                rgba(80, 45, 40, .04);
        }

        .back-button {
            font-size: 21px;
        }

        .profile-button {
            font-size: 18px;
        }

        .back-button:active,
        .profile-button:active {
            transform: scale(.95);
        }

        .page-title {

            font-size: 21px;

            font-weight: 900;

            color: #493a36;
        }

        .page-title span {
            color: #ed4c84;
        }


        /* ==========================================
           INTRO
        ========================================== */

        .intro {

            padding:
                6px
                18px
                14px;
        }

        .intro h1 {

            font-size: 25px;

            font-weight: 900;

            color: #493a36;
        }

        .intro p {

            margin-top: 5px;

            color: #a08d87;

            font-size: 11px;

            line-height: 1.5;
        }


        /* ==========================================
           CONTENT
        ========================================== */

        .content {

            width: 100%;

            padding:
                0 18px;

            overflow: visible;
        }


        /* ==========================================
           SEARCH
        ========================================== */

        .search-box {

            width: 100%;

            height: 47px;

            border:
                1.5px solid
                #efdce2;

            border-radius: 15px;

            background: #ffffff;

            display: flex;

            align-items: center;

            padding: 0 14px;

            margin-bottom: 11px;
        }

        .search-icon {

            color: #e94b82;

            font-size: 16px;

            margin-right: 9px;
        }

        .search-input {

            flex: 1;

            min-width: 0;

            height: 100%;

            border: none;

            outline: none;

            background: transparent;

            color: #493a36;

            font-size: 12px;
        }

        .search-input::placeholder {
            color: #b5a39d;
        }


        /* ==========================================
           ADD BUTTON
        ========================================== */

        .add-button {

            width: 100%;

            height: 48px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #f65b91,
                    #e9417b
                );

            color: #ffffff;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 7px 16px
                rgba(
                    239,
                    79,
                    135,
                    .20
                );

            margin-bottom: 20px;
        }

        .add-button:active {
            transform: scale(.98);
        }


        /* ==========================================
           SECTION
        ========================================== */

        .section-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 10px;
        }

        .section-title {

            font-size: 15px;

            font-weight: 900;

            color: #493a36;
        }

        .pig-count {

            min-width: 25px;

            height: 24px;

            padding: 0 8px;

            border-radius: 12px;

            background: #ffe8ef;

            color: #e94b82;

            font-size: 10px;

            font-weight: 800;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* ==========================================
           EMPTY STATE
        ========================================== */

        .empty-state {

            border:
                1px dashed
                #edcbd5;

            border-radius: 18px;

            min-height: 210px;

            background: #fffdfc;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 25px;
        }

        .empty-icon {

            width: 65px;
            height: 65px;

            border-radius: 50%;

            background: #fff0f4;

            border:
                1px solid
                #f5d1dc;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 32px;

            margin-bottom: 12px;
        }

        .empty-title {

            font-size: 14px;

            font-weight: 900;

            color: #594741;
        }

        .empty-text {

            max-width: 270px;

            margin-top: 6px;

            color: #a3918b;

            font-size: 10px;

            line-height: 1.6;
        }

        .empty-add {

            margin-top: 15px;

            height: 38px;

            padding: 0 18px;

            border: none;

            border-radius: 12px;

            background: #ffe5ed;

            color: #e94b82;

            font-size: 10px;

            font-weight: 800;

            cursor: pointer;
        }


        /* ==========================================
           PIG LIST
        ========================================== */

        .pig-list {

            display: flex;

            flex-direction: column;

            gap: 11px;
        }


        /* ==========================================
           PIG CARD
           WHOLE CARD IS CLICKABLE
        ========================================== */

        .pig-card {

            width: 100%;

            border:
                1px solid
                #f0dfe3;

            border-radius: 18px;

            background: #ffffff;

            padding: 13px;

            display: flex;

            align-items: center;

            gap: 12px;

            box-shadow:
                0 4px 14px
                rgba(
                    78,
                    47,
                    40,
                    .05
                );

            cursor: pointer;

            transition:
                transform .15s ease,
                background .15s ease,
                box-shadow .15s ease;
        }

        .pig-card:hover {

            box-shadow:
                0 7px 18px
                rgba(
                    78,
                    47,
                    40,
                    .08
                );
        }

        .pig-card:active {

            transform: scale(.985);

            background: #fff6f8;
        }


        /* ==========================================
           PIG AVATAR
        ========================================== */

        .pig-avatar {

            width: 62px;
            height: 62px;

            flex-shrink: 0;

            border-radius: 17px;

            background: #ffe8ef;

            border:
                1px solid
                #f5c8d6;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 31px;
        }


        /* ==========================================
           PIG INFO
        ========================================== */

        .pig-info {

            min-width: 0;

            flex: 1;
        }

        .pig-name {

            font-size: 14px;

            font-weight: 900;

            color: #493a36;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .pig-details {

            margin-top: 5px;

            display: flex;

            flex-wrap: wrap;

            gap: 5px;
        }

        .detail-tag {

            padding:
                4px
                7px;

            border-radius: 7px;

            background: #fff2f5;

            color: #a47785;

            font-size: 8px;

            font-weight: 700;
        }

        .pig-status {

            margin-top: 6px;

            font-size: 9px;

            color: #73a07a;

            font-weight: 700;
        }


        /* ==========================================
           ARROW
        ========================================== */

        .pig-arrow {

            width: 28px;
            height: 28px;

            flex-shrink: 0;

            border-radius: 9px;

            background: #fff0f4;

            color: #e94b82;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 19px;

            font-weight: 700;
        }


        /* ==========================================
           MODAL OVERLAY
        ========================================== */

        .modal-overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(
                    50,
                    30,
                    27,
                    .40
                );

            z-index: 100;

            display: none;

            align-items: flex-end;

            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }


        /* ==========================================
           MODAL
        ========================================== */

        .modal {

            width: 100%;

            max-width: 430px;

            max-height: 90vh;

            overflow-y: auto;

            background: #fffaf8;

            border-radius:
                25px
                25px
                0
                0;

            padding:
                20px
                18px
                28px;

            animation:
                slideUp .2s ease;
        }

        @keyframes slideUp {

            from {

                transform:
                    translateY(100%);
            }

            to {

                transform:
                    translateY(0);
            }
        }

        .modal-handle {

            width: 38px;

            height: 4px;

            border-radius: 10px;

            background: #dfccc8;

            margin:
                0 auto
                18px;
        }

        .modal-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 18px;
        }

        .modal-title {

            font-size: 19px;

            font-weight: 900;

            color: #493a36;
        }

        .close-modal {

            width: 34px;
            height: 34px;

            border-radius: 11px;

            border:
                1px solid
                #efdce2;

            background: #ffffff;

            color: #8e7a74;

            font-size: 18px;

            cursor: pointer;
        }


        /* ==========================================
           FORM
        ========================================== */

        .form-group {
            margin-bottom: 13px;
        }

        .form-label {

            display: block;

            margin-bottom: 6px;

            color: #594741;

            font-size: 11px;

            font-weight: 800;
        }

        .form-input,
        .form-select {

            width: 100%;

            height: 45px;

            border:
                1.5px solid
                #efdce2;

            border-radius: 13px;

            background: #ffffff;

            color: #493a36;

            outline: none;

            padding: 0 12px;

            font-size: 11px;
        }

        .form-input:focus,
        .form-select:focus {

            border-color:
                #ed7da2;

            box-shadow:
                0 0 0 3px
                rgba(
                    239,
                    79,
                    135,
                    .08
                );
        }

        .form-row {

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 10px;
        }

        .save-button {

            width: 100%;

            height: 48px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #f65b91,
                    #e9417b
                );

            color: #ffffff;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            margin-top: 6px;
        }


        /* ==========================================
           PIG DETAILS
        ========================================== */

        .details-avatar {

            width: 90px;
            height: 90px;

            border-radius: 24px;

            background: #ffe8ef;

            border:
                1px solid
                #f5c8d6;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 48px;

            margin:
                0 auto
                14px;
        }

        .details-name {

            text-align: center;

            font-size: 21px;

            font-weight: 900;

            color: #493a36;
        }

        .details-status {

            text-align: center;

            color: #75a07a;

            font-size: 10px;

            font-weight: 700;

            margin-top: 5px;
        }


        /* ==========================================
           DETAILS GRID
        ========================================== */

        .details-grid {

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 9px;

            margin-top: 20px;
        }

        .detail-box {

            border:
                1px solid
                #f0dfe3;

            background: #ffffff;

            border-radius: 14px;

            padding: 12px;
        }

        .detail-box-label {

            color: #a3918b;

            font-size: 9px;
        }

        .detail-box-value {

            margin-top: 4px;

            color: #493a36;

            font-size: 12px;

            font-weight: 800;

            word-break: break-word;
        }


        /* ==========================================
           DETAILS ACTIONS
        ========================================== */

        .details-actions {

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 10px;

            margin-top: 20px;
        }

        .details-action {

            height: 46px;

            border-radius: 14px;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;
        }

        .details-edit {

            border:
                1px solid
                #f2b6c9;

            background: #fff0f4;

            color: #e94b82;
        }

        .details-delete {

            border:
                1px solid
                #edc2c8;

            background: #fff7f7;

            color: #d85d72;
        }

        .details-action:active {
            transform: scale(.97);
        }


        /* ==========================================
           BOTTOM NAV
        ========================================== */

        .bottom-nav {

            position: fixed;

            left: 50%;

            bottom: 0;

            transform:
                translateX(-50%);

            width: 100%;

            max-width: 430px;

            height: 72px;

            background:
                rgba(
                    255,
                    250,
                    248,
                    .97
                );

            border-top:
                1px solid
                #f0dfe3;

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            z-index: 50;

            padding-bottom: 4px;
        }

        .nav-button {

            border: none;

            background: transparent;

            cursor: pointer;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 4px;

            color: #a99a95;

            font-size: 9px;

            font-weight: 600;
        }

        .nav-icon {

            width: 29px;
            height: 29px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            font-size: 17px;
        }

        .nav-button.active {
            color: #e94b82;
        }

        .nav-button.active .nav-icon {
            background: #ffe6ee;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 599px) {

            body {

                align-items: flex-start;

                overflow-x: hidden;
                overflow-y: auto;
            }

            .phone {

                width: 100%;

                min-height: 100vh;

                height: auto;

                overflow: visible;
            }

            .page {

                min-height: 100vh;

                height: auto;

                padding-bottom: 105px;

                overflow: visible;
            }
        }


        /* ==========================================
           DESKTOP
        ========================================== */

        @media (min-width: 600px) {

            body {

                align-items: flex-start;

                overflow-x: hidden;
                overflow-y: auto;

                padding: 20px 0;
            }

            .phone {

                min-height:
                    calc(100vh - 40px);

                height: auto;

                max-height: none;

                border-radius: 35px;

                box-shadow:
                    0 20px 60px
                    rgba(
                        70,
                        45,
                        38,
                        .18
                    );

                overflow: visible;
            }

            .page {

                min-height:
                    calc(100vh - 40px);

                height: auto;

                border-radius: 35px;

                overflow: visible;
            }
        }


        /* ==========================================
           FINAL SCROLL SAFETY
        ========================================== */

        html {

            width: 100%;

            min-height: 100%;

            overflow-x: hidden;
            overflow-y: auto;
        }

        body {

            width: 100%;

            min-height: 100vh;

            overflow-x: hidden !important;
            overflow-y: auto !important;
        }

        .phone,
        .page,
        .content {

            overflow: visible !important;
        }

    </style>

</head>


<body>


<div class="phone">


    <main class="page">


        <!-- ==========================================
             HEADER
        ========================================== -->

        <header class="top-header">

            <div class="header-left">

                <button
                    type="button"
                    class="back-button"
                    id="backButton"
                    aria-label="Back">

                    ←

                </button>


                <div class="page-title">

                    My
                    <span>Pigs</span>

                </div>

            </div>


            <button
                type="button"
                class="profile-button"
                id="profileButton"
                aria-label="Profile">

                👤

            </button>

        </header>


        <!-- ==========================================
             INTRO
        ========================================== -->

        <section class="intro">

            <h1>
                My Pigs
            </h1>

            <p>
                Manage and monitor your registered pigs.
            </p>

        </section>


        <!-- ==========================================
             CONTENT
        ========================================== -->

        <section class="content">


            <!-- SEARCH -->

            <div class="search-box">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    type="search"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search pig by name..."
                    autocomplete="off"
                >

            </div>


            <!-- ADD -->

            <button
                type="button"
                class="add-button"
                id="addButton">

                ＋ Add Pig

            </button>


            <!-- SECTION -->

            <div class="section-header">

                <div class="section-title">
                    Your Pigs
                </div>

                <div
                    class="pig-count"
                    id="pigCount">

                    0

                </div>

            </div>


            <!-- EMPTY -->

            <div
                class="empty-state"
                id="emptyState">

                <div class="empty-icon">
                    🐷
                </div>

                <div class="empty-title">
                    No pigs added yet
                </div>

                <div class="empty-text">
                    You haven't registered any pigs.
                    Add your first pig to start
                    keeping track of its information.
                </div>

                <button
                    type="button"
                    class="empty-add"
                    id="emptyAddButton">

                    ＋ Add Your First Pig

                </button>

            </div>


            <!-- LIST -->

            <div
                class="pig-list"
                id="pigList">
            </div>


        </section>


    </main>


    <!-- ==========================================
         ADD / EDIT MODAL
    ========================================== -->

    <div
        class="modal-overlay"
        id="formModal">


        <div class="modal">


            <div class="modal-handle"></div>


            <div class="modal-header">

                <div
                    class="modal-title"
                    id="formModalTitle">

                    Add Pig

                </div>


                <button
                    type="button"
                    class="close-modal"
                    id="closeFormModal">

                    ×

                </button>

            </div>


            <form id="pigForm">


                <div class="form-group">

                    <label
                        class="form-label"
                        for="pigName">

                        Pig Name

                    </label>

                    <input
                        type="text"
                        id="pigName"
                        class="form-input"
                        placeholder="Enter pig name"
                        maxlength="40"
                        required
                    >

                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label
                            class="form-label"
                            for="pigBreed">

                            Breed

                        </label>

                        <input
                            type="text"
                            id="pigBreed"
                            class="form-input"
                            placeholder="e.g. Large White"
                            maxlength="40"
                        >

                    </div>


                    <div class="form-group">

                        <label
                            class="form-label"
                            for="pigSex">

                            Sex

                        </label>

                        <select
                            id="pigSex"
                            class="form-select">

                            <option value="">
                                Select
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                        </select>

                    </div>


                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label
                            class="form-label"
                            for="pigAge">

                            Age

                        </label>

                        <input
                            type="number"
                            id="pigAge"
                            class="form-input"
                            placeholder="Age"
                            min="0"
                            max="30"
                        >

                    </div>


                    <div class="form-group">

                        <label
                            class="form-label"
                            for="pigWeight">

                            Weight (kg)

                        </label>

                        <input
                            type="number"
                            id="pigWeight"
                            class="form-input"
                            placeholder="Weight"
                            min="0"
                            step="0.1"
                        >

                    </div>


                </div>


                <div class="form-group">

                    <label
                        class="form-label"
                        for="pigDate">

                        Birth Date

                    </label>

                    <input
                        type="date"
                        id="pigDate"
                        class="form-input"
                    >

                </div>


                <button
                    type="submit"
                    class="save-button">

                    Save Pig

                </button>


            </form>


        </div>

    </div>


    <!-- ==========================================
         PIG DETAILS MODAL
    ========================================== -->

    <div
        class="modal-overlay"
        id="detailsModal">


        <div class="modal">


            <div class="modal-handle"></div>


            <div class="modal-header">

                <div class="modal-title">
                    Pig Details
                </div>


                <button
                    type="button"
                    class="close-modal"
                    id="closeDetailsModal">

                    ×

                </button>

            </div>


            <!-- PIG IMAGE -->

            <div class="details-avatar">
                🐷
            </div>


            <!-- NAME -->

            <div
                class="details-name"
                id="detailsName">

                -

            </div>


            <!-- STATUS -->

            <div
                class="details-status"
                id="detailsStatus">

                Active

            </div>


            <!-- INFORMATION -->

            <div class="details-grid">


                <div class="detail-box">

                    <div class="detail-box-label">
                        Breed
                    </div>

                    <div
                        class="detail-box-value"
                        id="detailsBreed">

                        -

                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-box-label">
                        Sex
                    </div>

                    <div
                        class="detail-box-value"
                        id="detailsSex">

                        -

                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-box-label">
                        Age
                    </div>

                    <div
                        class="detail-box-value"
                        id="detailsAge">

                        -

                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-box-label">
                        Weight
                    </div>

                    <div
                        class="detail-box-value"
                        id="detailsWeight">

                        -

                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-box-label">
                        Birth Date
                    </div>

                    <div
                        class="detail-box-value"
                        id="detailsBirthDate">

                        -

                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-box-label">
                        Added
                    </div>

                    <div
                        class="detail-box-value"
                        id="detailsAdded">

                        -

                    </div>

                </div>


            </div>


            <!-- ==========================================
                 EDIT / DELETE ONLY HERE
            ========================================== -->

            <div class="details-actions">


                <button
                    type="button"
                    class="details-action details-edit"
                    id="detailsEditButton">

                    ✏️ Edit Pig

                </button>


                <button
                    type="button"
                    class="details-action details-delete"
                    id="detailsDeleteButton">

                    🗑 Delete Pig

                </button>


            </div>


        </div>

    </div>


    <!-- ==========================================
         BOTTOM NAV
    ========================================== -->

    <nav class="bottom-nav">


        <button
            type="button"
            class="nav-button"
            data-page="home.html">

            <div class="nav-icon">
                🏠
            </div>

            <span>
                Home
            </span>

        </button>


        <button
            type="button"
            class="nav-button active"
            data-page="pigs.html">

            <div class="nav-icon">
                🐷
            </div>

            <span>
                Pigs
            </span>

        </button>


        <button
            type="button"
            class="nav-button"
            data-page="feed.html">

            <div class="nav-icon">
                🍚
            </div>

            <span>
                Feed
            </span>

        </button>


        <button
            type="button"
            class="nav-button"
            data-page="health.html">

            <div class="nav-icon">
                ❤️
            </div>

            <span>
                Health
            </span>

        </button>


        <button
            type="button"
            class="nav-button"
            data-page="profile.html">

            <div class="nav-icon">
                👤
            </div>

            <span>
                Profile
            </span>

        </button>


    </nav>


</div>


<script>

(function () {


    /* ==========================================
       LOGIN CHECK
    ========================================== */

    const loggedIn =
        localStorage.getItem(
            "porkyPalLoggedIn"
        );

    const currentUserRaw =
        localStorage.getItem(
            "porkyPalCurrentUser"
        );


    if (
        loggedIn !== "true" ||
        !currentUserRaw
    ) {

        window.location.replace(
            "login.html"
        );

        return;
    }


    let currentUser;


    try {

        currentUser =
            JSON.parse(
                currentUserRaw
            );

    } catch (error) {

        localStorage.removeItem(
            "porkyPalLoggedIn"
        );

        localStorage.removeItem(
            "porkyPalCurrentUser"
        );

        window.location.replace(
            "login.html"
        );

        return;
    }


    /* ==========================================
       EMAIL
    ========================================== */

    const email =
        String(
            currentUser.email || ""
        )
        .trim()
        .toLowerCase();


    if (!email) {

        window.location.replace(
            "login.html"
        );

        return;
    }


    /* ==========================================
       USER DATA KEY
    ========================================== */

    function getUserKey(type) {

        return (
            "porkyPal_" +
            type +
            "_" +
            encodeURIComponent(email)
        );

    }


    const dataKey =
        getUserKey("homeData");


    /* ==========================================
       LOAD DATA
    ========================================== */

    let userData = null;


    try {

        userData =
            JSON.parse(
                localStorage.getItem(
                    dataKey
                )
            );

    } catch (error) {

        userData = null;
    }


    if (!userData) {

        userData = {

            pigs: [],

            feedingRecords: [],

            healthRecords: [],

            events: [],

            activities: []

        };

    }


    /* ==========================================
       ENSURE ARRAYS
    ========================================== */

    if (!Array.isArray(userData.pigs)) {
        userData.pigs = [];
    }

    if (!Array.isArray(userData.feedingRecords)) {
        userData.feedingRecords = [];
    }

    if (!Array.isArray(userData.healthRecords)) {
        userData.healthRecords = [];
    }

    if (!Array.isArray(userData.events)) {
        userData.events = [];
    }

    if (!Array.isArray(userData.activities)) {
        userData.activities = [];
    }


    function saveData() {

        localStorage.setItem(
            dataKey,
            JSON.stringify(
                userData
            )
        );

    }


    saveData();


    /* ==========================================
       ELEMENTS
    ========================================== */

    const pigList =
        document.getElementById(
            "pigList"
        );

    const emptyState =
        document.getElementById(
            "emptyState"
        );

    const pigCount =
        document.getElementById(
            "pigCount"
        );

    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const formModal =
        document.getElementById(
            "formModal"
        );

    const detailsModal =
        document.getElementById(
            "detailsModal"
        );

    const formModalTitle =
        document.getElementById(
            "formModalTitle"
        );

    const pigForm =
        document.getElementById(
            "pigForm"
        );


    let editingPigId = null;

    let selectedPigId = null;


    /* ==========================================
       ADD MODAL
    ========================================== */

    function openAddModal() {

        editingPigId = null;

        formModalTitle.textContent =
            "Add Pig";

        pigForm.reset();

        formModal.classList.add(
            "show"
        );

    }


    document
        .getElementById(
            "addButton"
        )
        .addEventListener(
            "click",
            openAddModal
        );


    document
        .getElementById(
            "emptyAddButton"
        )
        .addEventListener(
            "click",
            openAddModal
        );


    /* ==========================================
       CLOSE FORM MODAL
    ========================================== */

    function closeFormModal() {

        formModal.classList.remove(
            "show"
        );

        editingPigId = null;

    }


    document
        .getElementById(
            "closeFormModal"
        )
        .addEventListener(
            "click",
            closeFormModal
        );


    /* ==========================================
       SAVE PIG
    ========================================== */

    pigForm.addEventListener(
        "submit",
        function (event) {

            event.preventDefault();


            const name =
                document
                    .getElementById(
                        "pigName"
                    )
                    .value
                    .trim();


            const breed =
                document
                    .getElementById(
                        "pigBreed"
                    )
                    .value
                    .trim();


            const sex =
                document
                    .getElementById(
                        "pigSex"
                    )
                    .value;


            const age =
                document
                    .getElementById(
                        "pigAge"
                    )
                    .value;


            const weight =
                document
                    .getElementById(
                        "pigWeight"
                    )
                    .value;


            const birthDate =
                document
                    .getElementById(
                        "pigDate"
                    )
                    .value;


            if (!name) {

                alert(
                    "Please enter the pig's name."
                );

                return;
            }


            /* ==================================
               EDIT
            ================================== */

            if (editingPigId) {


                const pig =
                    userData.pigs.find(
                        function (item) {

                            return (
                                item.id ===
                                editingPigId
                            );

                        }
                    );


                if (!pig) {

                    alert(
                        "Pig not found."
                    );

                    return;
                }


                pig.name =
                    name;

                pig.breed =
                    breed;

                pig.sex =
                    sex;

                pig.age =
                    age;

                pig.weight =
                    weight;

                pig.birthDate =
                    birthDate;

                pig.updatedAt =
                    new Date()
                        .toISOString();


                /* ACTIVITY */

                userData.activities.unshift({

                    id:
                        "activity_" +
                        Date.now() +
                        "_" +
                        Math.random()
                            .toString(36)
                            .substring(2, 7),

                    type:
                        "pig_updated",

                    text:
                        "Updated pig " +
                        name,

                    date:
                        new Date()
                            .toISOString()

                });


            } else {


                /* ==================================
                   ADD NEW PIG
                ================================== */

                const newPig = {

                    id:
                        "pig_" +
                        Date.now() +
                        "_" +
                        Math.random()
                            .toString(36)
                            .substring(2, 8),

                    name:
                        name,

                    breed:
                        breed,

                    sex:
                        sex,

                    age:
                        age,

                    weight:
                        weight,

                    birthDate:
                        birthDate,

                    status:
                        "Active",

                    createdAt:
                        new Date()
                            .toISOString()

                };


                userData.pigs.push(
                    newPig
                );


                /* ACTIVITY */

                userData.activities.unshift({

                    id:
                        "activity_" +
                        Date.now() +
                        "_" +
                        Math.random()
                            .toString(36)
                            .substring(2, 7),

                    type:
                        "pig_added",

                    text:
                        "Added pig " +
                        name,

                    date:
                        new Date()
                            .toISOString()

                });

            }


            /* KEEP LATEST 50 */

            if (
                userData.activities.length >
                50
            ) {

                userData.activities =
                    userData.activities
                        .slice(0, 50);

            }


            saveData();

            closeFormModal();

            renderPigs(
                searchInput.value
            );


            /* If details was open */
            if (selectedPigId) {

                const updatedPig =
                    userData.pigs.find(
                        function (pig) {

                            return (
                                pig.id ===
                                selectedPigId
                            );

                        }
                    );


                if (updatedPig) {

                    openDetails(
                        updatedPig
                    );

                }

            }

        }
    );


    /* ==========================================
       RENDER PIGS
    ========================================== */

    function renderPigs(
        searchTerm = ""
    ) {

        pigList.innerHTML =
            "";


        const search =
            String(searchTerm)
                .trim()
                .toLowerCase();


        const filtered =
            userData.pigs.filter(
                function (pig) {

                    return (

                        !search ||

                        String(
                            pig.name || ""
                        )
                        .toLowerCase()
                        .includes(search) ||

                        String(
                            pig.breed || ""
                        )
                        .toLowerCase()
                        .includes(search)

                    );

                }
            );


        pigCount.textContent =
            userData.pigs.length;


        /* NO PIGS */

        if (
            userData.pigs.length === 0
        ) {

            emptyState.style.display =
                "flex";

            return;

        }


        emptyState.style.display =
            "none";


        /* NO SEARCH RESULT */

        if (
            filtered.length === 0
        ) {

            const noResults =
                document.createElement(
                    "div"
                );


            noResults.className =
                "empty-state";


            noResults.innerHTML = `

                <div class="empty-icon">
                    🔍
                </div>

                <div class="empty-title">
                    No pig found
                </div>

                <div class="empty-text">
                    No registered pig matches your search.
                </div>

            `;


            pigList.appendChild(
                noResults
            );

            return;
        }


        /* ==================================
           PIG CARDS
           WHOLE CARD IS CLICKABLE
        ================================== */

        filtered.forEach(
            function (pig) {


                const card =
                    document.createElement(
                        "button"
                    );


                card.type =
                    "button";


                card.className =
                    "pig-card";


                const ageText =
                    pig.age
                        ? pig.age + " yr"
                        : "Age not set";


                const weightText =
                    pig.weight
                        ? pig.weight + " kg"
                        : "Weight not set";


                const breedText =
                    pig.breed ||
                    "Breed not set";


                card.innerHTML = `

                    <div class="pig-avatar">
                        🐷
                    </div>


                    <div class="pig-info">

                        <div class="pig-name">
                            ${escapeHTML(
                                pig.name
                            )}
                        </div>


                        <div class="pig-details">

                            <span class="detail-tag">
                                ${escapeHTML(
                                    breedText
                                )}
                            </span>

                            <span class="detail-tag">
                                ${escapeHTML(
                                    ageText
                                )}
                            </span>

                            <span class="detail-tag">
                                ${escapeHTML(
                                    weightText
                                )}
                            </span>

                        </div>


                        <div class="pig-status">

                            ●
                            ${escapeHTML(
                                pig.status ||
                                "Active"
                            )}

                        </div>

                    </div>


                    <div class="pig-arrow">
                        ›
                    </div>

                `;


                /* ==================================
                   CLICK WHOLE PIG
                ================================== */

                card.addEventListener(
                    "click",
                    function () {

                        openDetails(
                            pig
                        );

                    }
                );


                pigList.appendChild(
                    card
                );

            }
        );

    }


    /* ==========================================
       ESCAPE HTML
    ========================================== */

    function escapeHTML(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* ==========================================
       OPEN DETAILS
    ========================================== */

    function openDetails(pig) {

        selectedPigId =
            pig.id;


        document
            .getElementById(
                "detailsName"
            )
            .textContent =
            pig.name ||
            "-";


        document
            .getElementById(
                "detailsStatus"
            )
            .textContent =
            pig.status ||
            "Active";


        document
            .getElementById(
                "detailsBreed"
            )
            .textContent =
            pig.breed ||
            "Not set";


        document
            .getElementById(
                "detailsSex"
            )
            .textContent =
            pig.sex ||
            "Not set";


        document
            .getElementById(
                "detailsAge"
            )
            .textContent =
            pig.age
                ? pig.age +
                  " year(s)"
                : "Not set";


        document
            .getElementById(
                "detailsWeight"
            )
            .textContent =
            pig.weight
                ? pig.weight +
                  " kg"
                : "Not set";


        document
            .getElementById(
                "detailsBirthDate"
            )
            .textContent =
            pig.birthDate ||
            "Not set";


        document
            .getElementById(
                "detailsAdded"
            )
            .textContent =
            formatDate(
                pig.createdAt
            );


        detailsModal.classList.add(
            "show"
        );

    }


    /* ==========================================
       FORMAT DATE
    ========================================== */

    function formatDate(value) {

        if (!value) {

            return "Not available";

        }


        const date =
            new Date(value);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "Not available";

        }


        return date.toLocaleDateString(
            "en-US",
            {
                month: "short",
                day: "numeric",
                year: "numeric"
            }
        );

    }


    /* ==========================================
       CLOSE DETAILS
    ========================================== */

    function closeDetails() {

        detailsModal.classList.remove(
            "show"
        );

        selectedPigId = null;

    }


    document
        .getElementById(
            "closeDetailsModal"
        )
        .addEventListener(
            "click",
            closeDetails
        );


    /* ==========================================
       EDIT FROM DETAILS
    ========================================== */

    document
        .getElementById(
            "detailsEditButton"
        )
        .addEventListener(
            "click",
            function () {


                if (!selectedPigId) {
                    return;
                }


                const pig =
                    userData.pigs.find(
                        function (item) {

                            return (
                                item.id ===
                                selectedPigId
                            );

                        }
                    );


                if (!pig) {

                    alert(
                        "Pig not found."
                    );

                    return;
                }


                openEdit(
                    pig
                );

            }
        );


    /* ==========================================
       OPEN EDIT FORM
    ========================================== */

    function openEdit(pig) {

        editingPigId =
            pig.id;


        formModalTitle.textContent =
            "Edit Pig";


        document
            .getElementById(
                "pigName"
            )
            .value =
            pig.name ||
            "";


        document
            .getElementById(
                "pigBreed"
            )
            .value =
            pig.breed ||
            "";


        document
            .getElementById(
                "pigSex"
            )
            .value =
            pig.sex ||
            "";


        document
            .getElementById(
                "pigAge"
            )
            .value =
            pig.age ||
            "";


        document
            .getElementById(
                "pigWeight"
            )
            .value =
            pig.weight ||
            "";


        document
            .getElementById(
                "pigDate"
            )
            .value =
            pig.birthDate ||
            "";


        detailsModal.classList.remove(
            "show"
        );


        formModal.classList.add(
            "show"
        );

    }


    /* ==========================================
       DELETE FROM DETAILS
    ========================================== */

    document
        .getElementById(
            "detailsDeleteButton"
        )
        .addEventListener(
            "click",
            function () {


                if (!selectedPigId) {
                    return;
                }


                const pig =
                    userData.pigs.find(
                        function (item) {

                            return (
                                item.id ===
                                selectedPigId
                            );

                        }
                    );


                if (!pig) {

                    alert(
                        "Pig not found."
                    );

                    return;
                }


                deletePig(
                    pig
                );

            }
        );


    /* ==========================================
       DELETE PIG
    ========================================== */

    function deletePig(pig) {


        const confirmed =
            confirm(
                'Delete "' +
                pig.name +
                '" from your pigs?'
            );


        if (!confirmed) {
            return;
        }


        userData.pigs =
            userData.pigs.filter(
                function (item) {

                    return (
                        item.id !==
                        pig.id
                    );

                }
            );


        /* ACTIVITY */

        userData.activities.unshift({

            id:
                "activity_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2, 7),

            type:
                "pig_deleted",

            text:
                "Deleted pig " +
                pig.name,

            date:
                new Date()
                    .toISOString()

        });


        if (
            userData.activities.length >
            50
        ) {

            userData.activities =
                userData.activities
                    .slice(0, 50);

        }


        saveData();


        closeDetails();


        renderPigs(
            searchInput.value
        );

    }


    /* ==========================================
       SEARCH
    ========================================== */

    searchInput.addEventListener(
        "input",
        function () {

            renderPigs(
                searchInput.value
            );

        }
    );


    /* ==========================================
       CLOSE MODALS WHEN OUTSIDE
    ========================================== */

    formModal.addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                formModal
            ) {

                closeFormModal();

            }

        }
    );


    detailsModal.addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                detailsModal
            ) {

                closeDetails();

            }

        }
    );


    /* ==========================================
       BACK
    ========================================== */

    document
        .getElementById(
            "backButton"
        )
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "home.html";

            }
        );


    /* ==========================================
       PROFILE
    ========================================== */

    document
        .getElementById(
            "profileButton"
        )
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "profile.html";

            }
        );


    /* ==========================================
       BOTTOM NAV
    ========================================== */

    document
        .querySelectorAll(
            ".nav-button"
        )
        .forEach(
            function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        const page =
                            button.dataset.page;


                        if (page) {

                            window.location.href =
                                page;

                        }

                    }
                );

            }
        );


    /* ==========================================
       INITIAL LOAD
    ========================================== */

    renderPigs();


})();

</script>


</body>

</html>
