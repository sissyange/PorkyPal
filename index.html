<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PorkyPal</title>


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #eadfdd;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================================
           PHONE
        ========================================= */

        .phone {

            width: 100%;
            max-width: 430px;
            min-height: 100vh;

            background: #fffaf7;

            overflow: hidden;
        }


        /* =========================================
           MAIN
        ========================================= */

        .screen {

            min-height: 100vh;

            padding:
                28px
                22px
                20px;

            display: flex;
            flex-direction: column;

            background:
                linear-gradient(
                    180deg,
                    #fffafa 0%,
                    #fff5f1 100%
                );
        }


        /* =========================================
           PORKYPAL LOGO
        ========================================= */

        .logo {

            text-align: center;

            margin-bottom: 15px;
        }


        .logo h1 {

            font-family:
                "Trebuchet MS",
                Arial,
                sans-serif;

            font-size: 52px;

            line-height: .95;

            font-weight: 900;

            letter-spacing: -3px;

            color: #ed4c84;
        }


        .logo h1 span {
            color: #f28aa9;
        }


        .tagline {

            margin-top: 8px;

            color: #6f4d44;

            font-size: 12px;

            font-weight: 600;
        }


        /* =========================================
           FARM IMAGE AREA
        ========================================= */

        .farm {

            position: relative;

            width: 100%;

            height: 310px;

            overflow: hidden;

            border-radius: 30px;

            background:
                linear-gradient(
                    to bottom,
                    #dff6f5 0%,
                    #e9f8f0 44%,
                    #b4d993 45%,
                    #86b970 72%,
                    #e9b078 73%,
                    #f6c690 100%
                );

            box-shadow:
                0 10px 25px
                rgba(85,55,45,.13);
        }


        /* =========================================
           SUN
        ========================================= */

        .sun {

            position: absolute;

            width: 50px;
            height: 50px;

            top: 22px;
            right: 28px;

            border-radius: 50%;

            background: #ffd76d;

            box-shadow:
                0 0 0 8px
                rgba(255,215,109,.16);
        }


        /* =========================================
           CLOUD
        ========================================= */

        .cloud {

            position: absolute;

            width: 65px;
            height: 20px;

            background: white;

            opacity: .9;

            border-radius: 20px;
        }


        .cloud::before {

            content: "";

            position: absolute;

            width: 30px;
            height: 30px;

            left: 8px;
            bottom: 5px;

            background: white;

            border-radius: 50%;
        }


        .cloud::after {

            content: "";

            position: absolute;

            width: 23px;
            height: 23px;

            right: 8px;
            bottom: 4px;

            background: white;

            border-radius: 50%;
        }


        .cloud1 {
            left: 25px;
            top: 55px;
        }


        .cloud2 {

            right: 95px;
            top: 80px;

            transform: scale(.7);
        }


        /* =========================================
           HILLS
        ========================================= */

        .hill-back {

            position: absolute;

            width: 150%;
            height: 140px;

            left: -25%;
            bottom: 78px;

            background: #a6d58e;

            border-radius:
                50%
                50%
                0
                0;
        }


        .hill-front {

            position: absolute;

            width: 150%;
            height: 120px;

            left: -20%;
            bottom: 20px;

            background: #7eb46d;

            border-radius:
                50%
                50%
                0
                0;
        }


        /* =========================================
           BARN
        ========================================= */

        .barn {

            position: absolute;

            left: 25px;
            bottom: 105px;

            width: 80px;
            height: 75px;

            z-index: 2;
        }


        .roof {

            position: absolute;

            left: -7px;
            top: 0;

            width: 0;
            height: 0;

            border-left:
                47px solid transparent;

            border-right:
                47px solid transparent;

            border-bottom:
                32px solid #dc6d5e;
        }


        .barn-body {

            position: absolute;

            bottom: 0;

            width: 80px;
            height: 56px;

            background: #e4896c;
        }


        .barn-door {

            position: absolute;

            left: 28px;
            bottom: 0;

            width: 25px;
            height: 38px;

            background: #855247;

            border-radius:
                13px
                13px
                0
                0;
        }


        .barn-window {

            position: absolute;

            right: 8px;
            top: 13px;

            width: 17px;
            height: 15px;

            background: #d8f2ef;

            border:
                3px solid
                #b85e53;
        }


        /* =========================================
           FENCE
        ========================================= */

        .fence {

            position: absolute;

            left: 0;
            right: 0;

            bottom: 68px;

            height: 65px;

            z-index: 5;
        }


        .fence::before,
        .fence::after {

            content: "";

            position: absolute;

            left: 0;
            right: 0;

            height: 7px;

            background: #dda36a;

            border-radius: 5px;
        }


        .fence::before {
            top: 15px;
        }


        .fence::after {
            top: 40px;
        }


        .post {

            position: absolute;

            top: 0;

            width: 8px;
            height: 68px;

            background: #c98e59;

            border-radius: 4px;
        }


        .post1 {
            left: 8%;
        }


        .post2 {
            left: 28%;
        }


        .post3 {
            left: 48%;
        }


        .post4 {
            left: 68%;
        }


        .post5 {
            left: 88%;
        }


        /* =========================================
           PIG
        ========================================= */

        .pig {

            position: absolute;

            left: 50%;
            bottom: 2px;

            width: 190px;
            height: 205px;

            transform:
                translateX(-50%);

            z-index: 8;

            filter:
                drop-shadow(
                    0 8px 4px
                    rgba(70,45,35,.18)
                );
        }


        /* BODY */

        .pig-body {

            position: absolute;

            left: 24px;
            bottom: 12px;

            width: 142px;
            height: 92px;

            background: #f58ca8;

            border:
                3px solid
                #e77594;

            border-radius: 55%;
        }


        /* EARS */

        .ear {

            position: absolute;

            top: 6px;

            width: 49px;
            height: 52px;

            background: #ed7898;

            border:
                3px solid
                #d75d7e;

            z-index: 3;
        }


        .ear-left {

            left: 13px;

            transform:
                rotate(-32deg);

            border-radius:
                70%
                20%
                70%
                25%;
        }


        .ear-right {

            right: 13px;

            transform:
                rotate(32deg);

            border-radius:
                20%
                70%
                25%
                70%;
        }


        /* FACE */

        .face {

            position: absolute;

            left: 30px;
            top: 27px;

            width: 130px;
            height: 110px;

            background: #f690ab;

            border:
                3px solid
                #e77594;

            border-radius: 50%;

            z-index: 5;
        }


        /* EYES */

        .eye {

            position: absolute;

            top: 35px;

            width: 12px;
            height: 15px;

            background: #49322e;

            border-radius: 50%;
        }


        .eye-left {
            left: 32px;
        }


        .eye-right {
            right: 32px;
        }


        /* NOSE */

        .nose {

            position: absolute;

            left: 50%;
            bottom: 12px;

            transform:
                translateX(-50%);

            width: 61px;
            height: 41px;

            background: #f8a6b9;

            border:
                2px solid
                #df718e;

            border-radius: 50%;
        }


        .nostril {

            position: absolute;

            top: 12px;

            width: 9px;
            height: 11px;

            background: #a6506b;

            border-radius: 50%;
        }


        .nostril-left {
            left: 14px;
        }


        .nostril-right {
            right: 14px;
        }


        /* =========================================
           LEGS
        ========================================= */

        .leg {

            position: absolute;

            bottom: 0;

            width: 31px;
            height: 56px;

            background: #ed809d;

            border-radius:
                15px
                15px
                8px
                8px;

            z-index: 3;
        }


        .leg-left {
            left: 45px;
        }


        .leg-right {
            right: 45px;
        }


        /* =========================================
           TAIL
        ========================================= */

        .tail {

            position: absolute;

            right: 3px;
            bottom: 55px;

            width: 32px;
            height: 32px;

            border:
                7px solid
                #ed809d;

            border-left-color:
                transparent;

            border-bottom-color:
                transparent;

            border-radius: 50%;

            transform:
                rotate(30deg);
        }


        /* =========================================
           GRASS
        ========================================= */

        .grass {

            position: absolute;

            bottom: 0;

            width: 125px;
            height: 32px;

            background: #70a565;

            border-radius:
                60%
                60%
                0
                0;

            z-index: 10;
        }


        .grass-left {
            left: -25px;
        }


        .grass-right {
            right: -25px;
        }


        /* =========================================
           INTRO
        ========================================= */

        .intro {

            text-align: center;

            margin-top: 3px;

            padding:
                0
                5px;
        }


        .intro h2 {

            color: #493a36;

            font-size: 23px;

            line-height: 1.2;

            font-weight: 800;
        }


        .intro p {

            margin-top: 9px;

            color: #98827b;

            font-size: 13px;

            line-height: 1.5;
        }


        /* =========================================
           BUTTONS
        ========================================= */

        .buttons {

            width: 100%;

            margin-top: 18px;

            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        button {

            width: 100%;

            height: 52px;

            border-radius: 17px;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            font-family: Arial, sans-serif;

            transition:
                transform .15s ease,
                opacity .15s ease;
        }


        button:active {
            transform: scale(.98);
        }


        .get-started {

            border: none;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #f65b91,
                    #e9417b
                );

            box-shadow:
                0 8px 18px
                rgba(239,79,135,.25);
        }


        .get-started .arrow {

            margin-left: 7px;

            font-size: 19px;
        }


        .login {

            color: #e94b82;

            background: white;

            border:
                1.5px solid
                #f1b2c6;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            margin-top: auto;

            padding-top: 13px;

            text-align: center;

            color: #aa918a;

            font-size: 10px;
        }


        /* =========================================
           LOADING SCREEN
        ========================================= */

        .loading-screen {

            position: fixed;

            inset: 0;

            background: #fffaf7;

            z-index: 9999;

            display: none;

            align-items: center;

            justify-content: center;

            flex-direction: column;
        }


        .loading-screen.show {
            display: flex;
        }


        .loading-logo {

            width: 72px;
            height: 72px;

            border-radius: 22px;

            background: #ffe1eb;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 38px;

            margin-bottom: 15px;

            animation:
                bounce .8s infinite
                alternate;
        }


        .loading-text {

            color: #754d42;

            font-size: 14px;

            font-weight: 700;
        }


        .spinner {

            width: 25px;
            height: 25px;

            margin-top: 15px;

            border:
                3px solid
                #f6cbd9;

            border-top-color:
                #ed4c84;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        @keyframes bounce {

            from {
                transform:
                    translateY(0);
            }

            to {
                transform:
                    translateY(-6px);
            }
        }


        /* =========================================
           DESKTOP
        ========================================= */

        @media (min-width: 600px) {

            .phone {

                min-height: 820px;

                height: 100vh;

                max-height: 900px;

                border-radius: 35px;

                box-shadow:
                    0 20px 60px
                    rgba(70,45,38,.18);
            }

        }


        /* =========================================
           SMALL SCREEN
        ========================================= */

        @media (max-height: 720px) {

            .screen {

                padding-top: 15px;
            }


            .logo {

                margin-bottom: 8px;
            }


            .logo h1 {

                font-size: 44px;
            }


            .farm {

                height: 245px;
            }


            .pig {

                transform:
                    translateX(-50%)
                    scale(.82);

                transform-origin:
                    bottom center;
            }


            .intro h2 {

                font-size: 19px;
            }


            .buttons {

                margin-top: 10px;
            }


            button {

                height: 45px;
            }

        }


        /* =========================================
           VERY SMALL PHONE
        ========================================= */

        @media (max-width: 360px) {

            .screen {

                padding-left: 15px;

                padding-right: 15px;
            }


            .logo h1 {

                font-size: 40px;
            }


            .tagline {

                font-size: 10px;
            }


            .farm {

                height: 255px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         LOADING SCREEN
    ========================================= -->

    <div
        class="loading-screen"
        id="loadingScreen"
    >

        <div class="loading-logo">
            🐷
        </div>

        <div class="loading-text">
            Opening PorkyPal...
        </div>

        <div class="spinner"></div>

    </div>



    <!-- =========================================
         PHONE
    ========================================= -->

    <div class="phone">


        <!-- =====================================
             SCREEN
        ====================================== -->

        <main class="screen">


            <!-- =================================
                 LOGO
            ================================== -->

            <div class="logo">

                <h1>
                    Porky<span>Pal</span>
                </h1>

                <p class="tagline">
                    Healthy Pigs, Brighter Tomorrows
                </p>

            </div>



            <!-- =================================
                 FARM
            ================================== -->

            <section class="farm">


                <!-- SUN -->

                <div class="sun"></div>



                <!-- CLOUDS -->

                <div class="cloud cloud1"></div>

                <div class="cloud cloud2"></div>



                <!-- HILLS -->

                <div class="hill-back"></div>

                <div class="hill-front"></div>



                <!-- BARN -->

                <div class="barn">

                    <div class="roof"></div>

                    <div class="barn-body">

                        <div class="barn-door"></div>

                        <div class="barn-window"></div>

                    </div>

                </div>



                <!-- FENCE -->

                <div class="fence">

                    <div class="post post1"></div>

                    <div class="post post2"></div>

                    <div class="post post3"></div>

                    <div class="post post4"></div>

                    <div class="post post5"></div>

                </div>



                <!-- =================================
                     PIG
                ================================== -->

                <div class="pig">


                    <!-- BODY -->

                    <div class="pig-body"></div>



                    <!-- EARS -->

                    <div class="ear ear-left"></div>

                    <div class="ear ear-right"></div>



                    <!-- FACE -->

                    <div class="face">


                        <!-- EYES -->

                        <div class="eye eye-left"></div>

                        <div class="eye eye-right"></div>



                        <!-- NOSE -->

                        <div class="nose">

                            <div
                                class="nostril nostril-left"
                            ></div>

                            <div
                                class="nostril nostril-right"
                            ></div>

                        </div>


                    </div>



                    <!-- LEGS -->

                    <div class="leg leg-left"></div>

                    <div class="leg leg-right"></div>



                    <!-- TAIL -->

                    <div class="tail"></div>


                </div>



                <!-- GRASS -->

                <div class="grass grass-left"></div>

                <div class="grass grass-right"></div>


            </section>



            <!-- =================================
                 TEXT
            ================================== -->

            <section class="intro">

                <h2>

                    Smart care. Happy pigs.<br>

                    Better farming.

                </h2>


                <p>

                    Keep your pigs healthy and your farm
                    organized with PorkyPal.

                </p>

            </section>



            <!-- =================================
                 BUTTONS
            ================================== -->

            <section class="buttons">


                <!-- GET STARTED -->

                <button
                    class="get-started"
                    id="getStarted"
                    type="button"
                >

                    Get Started

                    <span class="arrow">
                        →
                    </span>

                </button>



                <!-- LOG IN -->

                <button
                    class="login"
                    id="login"
                    type="button"
                >

                    Log In

                </button>


            </section>



            <!-- =================================
                 FOOTER
            ================================== -->

            <div class="footer">

                🐷 Your smart farm companion

            </div>


        </main>


    </div>



    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>


        /* =====================================================
           AUTOMATIC LOGIN CHECK
           
           Kapag naka-login na ang user at hindi pa nag-logout,
           automatic siyang pupunta sa home.html.
        ===================================================== */

        (function checkExistingLogin() {

            const loggedIn =
                localStorage.getItem(
                    "porkyPalLoggedIn"
                );


            const currentUser =
                localStorage.getItem(
                    "porkyPalCurrentUser"
                );


            if (
                loggedIn === "true" &&
                currentUser
            ) {

                try {

                    const user =
                        JSON.parse(currentUser);


                    if (
                        user &&
                        user.email
                    ) {

                        /*
                         * Small loading screen bago
                         * pumunta sa Home.
                         */

                        const loadingScreen =
                            document.getElementById(
                                "loadingScreen"
                            );


                        if (loadingScreen) {

                            loadingScreen.classList.add(
                                "show"
                            );

                        }


                        setTimeout(
                            function () {

                                window.location.replace(
                                    "home.html"
                                );

                            },
                            250
                        );


                        return;

                    }

                } catch (error) {

                    console.log(
                        "Invalid saved PorkyPal login."
                    );


                    /*
                     * Burahin ang sirang session
                     * para makapag-login ulit.
                     */

                    localStorage.removeItem(
                        "porkyPalLoggedIn"
                    );

                    localStorage.removeItem(
                        "porkyPalCurrentUser"
                    );

                }

            }

        })();



        /* =====================================================
           GET STARTED
        ===================================================== */

        const getStarted =
            document.getElementById(
                "getStarted"
            );


        getStarted.addEventListener(
            "click",
            function () {

                /*
                 * Kung hindi pa logged in,
                 * pupunta sa login.
                 */

                window.location.href =
                    "login.html";

            }
        );



        /* =====================================================
           LOG IN
        ===================================================== */

        const login =
            document.getElementById(
                "login"
            );


        login.addEventListener(
            "click",
            function () {

                /*
                 * Kung hindi pa logged in,
                 * pupunta sa login.
                 */

                window.location.href =
                    "login.html";

            }
        );


    </script>


</body>

</html>
